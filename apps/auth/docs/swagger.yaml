        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Mint pre-authorized code cho một thành viên khác của project
      tags:
