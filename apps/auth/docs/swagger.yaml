  /oauth2/authorize:
    get:
      description: |-
        Kiểm tra tham số rồi chuyển hướng (302). Không có phiên: sang trang đăng nhập của ứng dụng (<AUTH_APP_BASE_URL>/oauth) kèm tham số; trang đó gọi /auth/login, /auth/profile, /auth/scope rồi chuyển về redirect_uri kèm code.
        Có phiên (cookie `medplum-<client_id>` hoặc id_token_hint): tạo Login mới; prompt=none thì trả code ngay, không thì sang trang ứng dụng để xác nhận scope.
        Lỗi về client_id hoặc redirect_uri hiển thị trực tiếp (400 văn bản); lỗi khác chuyển về redirect_uri kèm error, error_description, state và iss (RFC 9207).
        Client không có secret bắt buộc có code_challenge (S256). PKCE không được kế thừa từ phiên cũ.
        POST nhận cùng tham số ở form `application/x-www-form-urlencoded`.
      parameters:
      - description: code
        in: query
        name: response_type
        required: true
        type: string
      - description: client_id
        in: query
        name: client_id
        required: true
        type: string
      - description: khớp chính xác một redirect URI đã đăng ký
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: mặc định defaultScope của client
        in: query
        name: scope
        type: string
      - description: trả nguyên
        in: query
        name: state
        type: string
      - description: vào id token
        in: query
        name: nonce
        type: string
      - description: PKCE
        in: query
        name: code_challenge
        type: string
      - description: S256
        in: query
        name: code_challenge_method
        type: string
      - description: cùng scheme và host với auth hoặc fhir-server
        in: query
        name: aud
        type: string
      - description: id SmartAppLaunch
        in: query
        name: launch
        type: string
      - description: none | login
        in: query
        name: prompt
        type: string
      - description: tuổi tối đa của phiên (giây), mặc định 3600
        in: query
        name: max_age
        type: integer
      - description: id token đã cấp cho client này
        in: query
        name: id_token_hint
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Bắt đầu luồng authorization code (OAuth2/OIDC)
      tags:
      - oauth
    post:
