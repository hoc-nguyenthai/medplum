        name: _total
        type: string
      - description: Rút gọn kết quả
        enum:
        - "true"
        - text
        - data
        - count
        - "false"
        in: formData
        name: _summary
        type: string
      - description: Chỉ trả các phần tử này, phân cách bằng dấu phẩy
        in: formData
        name: _elements
        type: string
      - description: 'Kèm resource được tham chiếu. Ví dụ: Observation:subject'
        example: Observation:subject
        in: formData
        name: _include
        type: string
      - description: 'Kèm resource tham chiếu tới kết quả. Ví dụ: Observation:subject'
        example: Observation:subject
        in: formData
        name: _revinclude
        type: string
      - description: Lọc theo id (nhiều giá trị cách nhau bằng dấu phẩy)
        in: formData
        name: _id
        type: string
      - description: 'Lọc theo thời điểm cập nhật, hỗ trợ tiền tố ge/le/gt/lt. Ví
          dụ: ge2026-01-01'
        example: ge2026-01-01
        in: formData
        name: _lastUpdated
        type: string
