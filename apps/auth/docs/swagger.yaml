  /email/v1/send:
    post:
      consumes:
      - application/json
      description: 'Chỉ admin của project có tính năng `email`. Thứ tự lỗi: 401 chưa
        xác thực, 400 sai kiểu (gộp mọi lỗi), 400 `Email feature is not enabled for
        this project`, 403 `Only project administrators can send emails`, 400 cấu
        hình SMTP của project dở, 400 `Email is not configured on this server. Set
        up SMTP.`, 400 tệp đính kèm lỗi, 502 SMTP lỗi (thông điệp chung). Người gửi
        `from` chỉ được dùng nếu thuộc danh sách được duyệt, không thì dùng địa chỉ
        mặc định. Đính kèm: nội dung nhúng (content + encoding) hoặc URL https (path);
        `Binary/<id>` đọc từ dịch vụ FHIR bằng token của người gọi (cần AUTH_EMAIL_FHIR_URL,
        không thì 400 chưa hỗ trợ; không tồn tại hoặc không có quyền thì 400 và không
        gửi); đường dẫn khác bị từ chối. Mọi giá trị header chứa xuống dòng bị từ
        chối.'
      parameters:
      - description: Thư
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.SendEmailBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
