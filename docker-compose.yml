# Cấu hình nằm ở apps/fhir-server/.env. Chạy từ thư mục này:
#   docker compose --env-file apps/fhir-server/.env up --build
# Dừng và xóa cả volume dữ liệu: docker compose down --volumes
name: trivita-fhir-server

services:
  fhir-server:
    # Cần FHIR_WRITE_TOKENS trong apps/fhir-server/.env: docker compose --env-file apps/fhir-server/.env up --build fhir-server postgres
    # Nhiều replica: đặt DATABASE_AUTO_MIGRATE=false và chạy `migrate up` ở bước riêng.
    # Dockerfile RIÊNG của fhir-server: context là gốc repo, thư viện quan sát qua build context có tên (không cần context ở thư mục cha)
    build:
      context: .
      dockerfile: apps/fhir-server/Dockerfile
    image: trivita-fhir-server:local
    restart: unless-stopped
    ports:
      - "${FHIR_SERVER_PORT:-8005}:8000"
    env_file:
      - path: apps/fhir-server/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      # Một database nhiều schema: role fhir_app, schema fhir (deploy/postgres-init/01-schemas.sh); app từ chối chạy nếu search_path sai
      DATABASE_URL: postgres://fhir_app:${FHIR_DB_PASSWORD:-fhir}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
      DATABASE_REQUIRE_SCHEMA: "true"
      DATABASE_AUTO_MIGRATE: "true" # 1 replica: app tự migrate
      FHIR_BASE_URL: http://localhost:${FHIR_SERVER_PORT:-8005}/fhir/R4
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    # Dịch vụ xác thực. CÙNG database PostgreSQL với fhir-server nhưng schema và role RIÊNG (identity_app, schema identity).
    # Chạy: docker compose --env-file apps/auth/.env up --build auth postgres
    # Dockerfile RIÊNG của auth: context là gốc repo, thư viện quan sát qua build context có tên (không cần context ở thư mục cha)
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    image: trivita-auth:local
    restart: unless-stopped
    ports:
      - "${AUTH_PORT_PUBLISHED:-8006}:8000"
    env_file:
      - path: apps/auth/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      # CÙNG database với fhir-server nhưng role identity_app và schema identity (User, Login... chứa bí mật; role fhir_app không đọc được)
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:-identity}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
      DATABASE_REQUIRE_SCHEMA: "true"
      DATABASE_AUTO_MIGRATE: "true"
      AUTH_BASE_URL: http://localhost:${AUTH_PORT_PUBLISHED:-8006}
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy

  ws-gateway:
    # Giữ websocket của Subscription (tách khỏi fhir-server). Không có database: chỉ cần Redis và FHIR_WS_SIGNING_KEY GIỐNG fhir-server.
    # Chạy: docker compose --env-file apps/ws-gateway/.env up --build ws-gateway redis
    # fhir-server cần ở chế độ FHIR_WS_MODE=issuer để có gì đó cho gateway nhận: dùng docker-compose.ws.yml (chồng lên file này).
    # Dockerfile RIÊNG của ws-gateway: context là gốc repo, thư viện quan sát qua build context có tên (không cần context ở thư mục cha)
    build:
      context: .
      dockerfile: apps/ws-gateway/Dockerfile
    image: trivita-ws-gateway:local
    restart: unless-stopped
    ports:
      - "${WS_GATEWAY_PORT:-8007}:8000"
    env_file:
      - path: apps/ws-gateway/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trivita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivita}
      POSTGRES_DB: ${POSTGRES_DB:-trivita}
      # mật khẩu role của từng service, dùng ở deploy/postgres-init/01-schemas.sh (mặc định chỉ để dev)
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      FHIR_DB_PASSWORD: ${FHIR_DB_PASSWORD:-fhir}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
