      - application/json
      description: Body là mảng ProjectSite; thay toàn bộ Project.site. googleClientId
        và recaptchaSiteKey phải duy nhất giữa các project (409) và googleClientId
        không được trùng Google client chính của máy chủ; cặp id/secret phải đi cùng
        nhau. Phản hồi che khóa bí mật (`********`); gửi lại đúng giá trị che nghĩa
        là giữ secret hiện có của site cùng tên.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: Danh sách site
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/fhir.ProjectSite'
          type: array
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AdminProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đặt các site của project (Google, reCAPTCHA)
