      resource:
        allOf:
        - $ref: '#/definitions/httpapi.PatientBody'
        description: resource của entry (bỏ qua với GET và DELETE); ví dụ này dùng
          Patient
    required:
    - request
    - resource
    type: object
  httpapi.BundleRequestBody:
    properties:
      method:
        description: phương thức HTTP của entry
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        example: POST
        type: string
      url:
        description: đường dẫn tương đối tới gốc FHIR, ví dụ Patient hoặc Patient/123
        example: Patient
        type: string
    required:
    - method
    - url
    type: object
  httpapi.ContactPointBody:
    properties:
      system:
        description: kênh liên lạc
        enum:
        - phone
        - fax
        - email
        - pager
        - url
        - sms
        - other
        example: phone
        type: string
      use:
        description: mục đích dùng
        enum:
        - home
        - work
        - temp
        - old
        - mobile
        example: mobile
        type: string
      value:
        description: số điện thoại, địa chỉ email...
        example: "0900000000"
        type: string
    type: object
  httpapi.ExportManifest:
    properties:
      error:
        description: các lỗi từng phần (OperationOutcome); rỗng khi không có
        items: {}
        type: array
      output:
        description: các tệp kết quả
        items:
          $ref: '#/definitions/httpapi.ExportOutputFile'
        type: array
      request:
        description: URL yêu cầu export ban đầu
        example: http://localhost:8005/fhir/R4/$export?_type=Patient
        type: string
      requiresAccessToken:
        description: true khi tải tệp cần Bearer token
        example: true
        type: boolean
      transactionTime:
        description: thời điểm chụp dữ liệu của export
        example: "2026-11-21T10:00:00Z"
        format: date-time
        type: string
    required:
    - error
    - output
    - request
    - requiresAccessToken
    - transactionTime
    type: object
  httpapi.ExportOutputFile:
    properties:
      count:
        description: số resource trong tệp
        example: 120
        type: integer
      type:
        description: loại resource trong tệp NDJSON
        example: Patient
        type: string
      url:
        description: địa chỉ tải tệp (Binary)
        example: http://localhost:8005/fhir/R4/Binary/abc123
        type: string
    required:
    - type
    - url
    type: object
  httpapi.FHIRResource:
    additionalProperties: {}
    type: object
  httpapi.GraphQLError:
    properties:
      message:
        description: thông điệp lỗi
        example: Cannot query field "foo" on type "Patient"
        type: string
    required:
    - message
    type: object
  httpapi.GraphQLRequest:
    properties:
      operationName:
        description: tên operation cần chạy khi query có nhiều operation
        example: GetPatient
        type: string
      query:
        description: truy vấn GraphQL
        example: '{ Patient(id: "123") { id name { family } } }'
        type: string
      variables:
        additionalProperties: {}
        description: giá trị biến của truy vấn
        type: object
    required:
    - query
    type: object
  httpapi.GraphQLResponse:
    properties:
      data:
        additionalProperties: {}
        description: kết quả truy vấn; vắng khi lỗi cú pháp
        type: object
      errors:
        description: lỗi GraphQL; vắng khi thành công hoàn toàn
        items:
          $ref: '#/definitions/httpapi.GraphQLError'
        type: array
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        description: luôn "ok" khi tiến trình còn sống
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.HumanNameBody:
    properties:
      family:
        description: họ
        example: Nguyen
        type: string
      given:
        description: tên đệm và tên, mỗi phần tử một từ hoặc cụm
        example:
        - Van A
        items:
          type: string
        type: array
      use:
        description: mục đích dùng tên
        enum:
        - usual
        - official
        - temp
        - nickname
        - anonymous
        - old
        - maiden
        example: official
        type: string
    type: object
  httpapi.IdentifierBody:
    properties:
      system:
        description: không gian tên của giá trị (URI)
        example: http://hospital.example.org/mrn
        type: string
      value:
        description: giá trị định danh trong system
        example: MRN-0001
        type: string
    type: object
  httpapi.JSONPatchOp:
    properties:
      from:
        description: nguồn, bắt buộc với move và copy
        example: /telecom/0
        type: string
      op:
        description: thao tác RFC 6902
        enum:
        - add
        - remove
        - replace
        - move
        - copy
        - test
        example: replace
        type: string
      path:
        description: JSON Pointer tới vị trí cần sửa
        example: /gender
        type: string
      value:
        description: giá trị mới, bắt buộc với add, replace và test
    required:
    - op
    - path
    type: object
  httpapi.PatientBody:
    properties:
      active:
        description: hồ sơ còn dùng
        example: true
        type: boolean
      birthDate:
        description: ngày sinh, định dạng YYYY[-MM[-DD]]
        example: "1990-05-20"
        type: string
      gender:
        description: giới tính hành chính
        enum:
        - male
        - female
        - other
        - unknown
        example: male
        type: string
      id:
        description: id logic; khi tạo mới server cấp id (bỏ qua giá trị gửi lên,
          trừ update-as-create)
        example: "123"
        type: string
      identifier:
        description: định danh nghiệp vụ (mã bệnh nhân...)
        items:
          $ref: '#/definitions/httpapi.IdentifierBody'
        type: array
      name:
        description: họ tên
        items:
          $ref: '#/definitions/httpapi.HumanNameBody'
        type: array
      resourceType:
        description: luôn "Patient" với body này
        example: Patient
        type: string
      telecom:
        description: phương thức liên lạc
        items:
          $ref: '#/definitions/httpapi.ContactPointBody'
        type: array
    required:
    - resourceType
    type: object
  httpapi.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: boolean
        description: 'kết quả từng phụ thuộc: accepting_traffic, database, broker
          (chỉ khi bật Subscription)'
        type: object
      ready:
        description: true khi nhận được lưu lượng (không đang tắt, mọi phụ thuộc sẵn
          sàng)
        example: true
        type: boolean
    required:
    - checks
    - ready
    type: object
info:
  contact: {}
  description: FHIR R4 REST (CRUD, search, history, batch/transaction), operation,
    bulk export, terminology và GraphQL. Lỗi trả về dạng OperationOutcome (application/fhir+json).
  title: Trivita FHIR Server API
  version: "1.0"
paths:
  /fhir/R4:
    post:
      consumes:
      - application/fhir+json
      description: 'POST Bundle (type batch hoặc transaction) vào gốc. Cần quyền write.
        Transaction là tất cả hoặc không: một entry lỗi thì rollback toàn bộ. Batch
        xử lý từng entry độc lập, lỗi nằm trong response của entry đó.'
      parameters:
      - description: Bundle batch hoặc transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.BundleBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: Bundle batch-response hoặc transaction-response
          schema:
            $ref: '#/definitions/fhir.Bundle'
        "400":
          description: Bundle sai cấu trúc hoặc type không hỗ trợ
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Batch / transaction
      tags:
      - fhir
  /fhir/R4/$export:
    get:
      description: 'Cũng có Patient/$export và Group/{id}/$export. Bắt buộc header
        Prefer: respond-async. Trả 202 kèm Content-Location trỏ tới bulkdata/{id}/status;
        gọi URL đó (poll) cho tới khi nhận 200 và manifest.'
      parameters:
      - default: respond-async
        description: 'Bắt buộc: respond-async'
        in: header
        name: Prefer
        required: true
        type: string
      - description: Chỉ export các loại resource này, phân cách bằng dấu phẩy
        in: query
        name: _type
        type: string
      - description: Chỉ export resource cập nhật từ thời điểm này
        in: query
        name: _since
        type: string
      - description: Định dạng tệp; chỉ hỗ trợ application/fhir+ndjson
        in: query
        name: _outputFormat
        type: string
      produces:
      - application/fhir+json
      responses:
        "202":
          description: Job đã nhận; header Content-Location tới bulkdata/{id}/status
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: 'Thiếu Prefer: respond-async hoặc tham số sai'
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Bulk export ($export)
      tags:
      - bulk
  /fhir/R4/$graphql:
    post:
      consumes:
      - application/json
      description: Truy vấn FHIR bằng GraphQL. Lỗi cú pháp hoặc truy vấn nằm trong
        trường errors của body, HTTP vẫn 200.
      parameters:
      - description: '{query, variables, operationName}'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.GraphQLRequest'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.GraphQLResponse'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: GraphQL
      tags:
      - fhir
  /fhir/R4/{resourceType}:
    get:
      description: 'Trả Bundle searchset. Ngoài các tham số điều khiển bên dưới, mọi
        search param của loại resource (ví dụ Patient: family, given, birthdate, identifier;
        Observation: code, subject, date) truyền qua query string theo chuẩn FHIR,
        kèm modifier (:exact, :missing...), prefix so sánh, chuỗi chained (subject.name=...)
        và _has. Danh sách đầy đủ theo từng loại ở GET /fhir/R4/metadata.'
      parameters:
      - description: Loại resource, ví dụ Patient
        in: path
        name: resourceType
        required: true
        type: string
      - description: 'Số kết quả mỗi trang. Ví dụ: 10'
        in: query
        name: _count
        type: integer
      - description: Vị trí bắt đầu (phân trang)
        in: query
        name: _offset
        type: integer
      - description: 'Sắp xếp, phân cách bằng dấu phẩy; tiền tố - để giảm dần. Ví
          dụ: -_lastUpdated,family'
        in: query
        name: _sort
        type: string
      - description: Cách tính tổng
        enum:
        - none
        - estimate
        - accurate
        in: query
        name: _total
        type: string
      - description: Rút gọn kết quả
        enum:
        - "true"
        - text
        - data
        - count
        - "false"
        in: query
        name: _summary
        type: string
      - description: Chỉ trả các phần tử này, phân cách bằng dấu phẩy
        in: query
        name: _elements
        type: string
      - description: 'Kèm resource được tham chiếu. Ví dụ: Observation:subject'
        in: query
        name: _include
        type: string
      - description: 'Kèm resource tham chiếu tới kết quả. Ví dụ: Observation:subject'
        in: query
        name: _revinclude
        type: string
      - description: Lọc theo id (nhiều giá trị cách nhau bằng dấu phẩy)
        in: query
        name: _id
        type: string
      - description: 'Giới hạn trong compartment của một bệnh nhân. Dạng Patient/<id>,
          chỉ loại thuộc compartment Patient. Ví dụ: Patient/123'
        in: query
        name: _compartment
        type: string
      - description: 'Lọc theo thời điểm cập nhật, hỗ trợ tiền tố ge/le/gt/lt. Ví
          dụ: ge2026-01-01'
        in: query
        name: _lastUpdated
        type: string
      - description: Biểu thức _filter của FHIR
        in: query
        name: _filter
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Bundle'
        "400":
          description: Search param không hợp lệ hoặc không hỗ trợ
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Tìm kiếm theo loại resource
      tags:
      - fhir
    post:
      consumes:
      - application/fhir+json
      description: Hỗ trợ If-None-Exist (create có điều kiện). Trả 201 kèm Location
        và ETag. Sai cấu trúc/kiểu dữ liệu trả 400; giá trị code không thuộc ValueSet
        (ví dụ gender sai) hiện chưa bị từ chối.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Resource (mẫu là Patient)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.PatientBody'
      - description: 'Điều kiện search; nếu đã có resource khớp thì không tạo mới.
          Ví dụ: identifier=123'
        in: header
        name: If-None-Exist
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: If-None-Exist khớp đúng một resource, trả resource đó
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "201":
          description: Đã tạo; header Location và ETag
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "400":
          description: Sai cấu trúc, kiểu dữ liệu hoặc invariant
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "412":
          description: If-None-Exist khớp nhiều resource
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Tạo resource
      tags:
      - fhir
    put:
      consumes:
      - application/fhir+json
      description: 'Dùng query search làm điều kiện: PUT, PATCH và DELETE trên /{resourceType}?...
        (cùng đường dẫn, khác method). Khớp 0 resource: PUT tạo mới, PATCH/DELETE
        trả 404; khớp nhiều resource trả 412.'
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Resource (PUT, mẫu là Patient) hoặc JSON Patch (PATCH)
        in: body
        name: body
        schema:
          $ref: '#/definitions/httpapi.PatientBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: Đã cập nhật
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "201":
          description: Không có resource khớp, đã tạo mới (PUT)
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "400":
          description: Thiếu điều kiện search hoặc body sai
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "412":
          description: Điều kiện khớp nhiều resource
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Update/patch/delete có điều kiện
      tags:
      - fhir
  /fhir/R4/{resourceType}/$reindex:
    post:
      description: Cần quyền admin. Trả 202 kèm Content-Location tới /fhir/R4/job/{id}/status.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "202":
          description: Job đã nhận; header Content-Location
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền admin)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: $reindex cả loại resource (job nền)
      tags:
      - operation
  /fhir/R4/{resourceType}/$validate:
    post:
      consumes:
      - application/fhir+json
      description: Kiểm tra resource theo cấu trúc, kiểu, cardinality và invariant
        FHIRPath mà không lưu. Kết quả luôn là OperationOutcome; lỗi dữ liệu nằm trong
        issue, không phải mã HTTP 4xx.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Resource cần kiểm tra (hoặc Parameters có parameter resource)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.PatientBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: Các issue tìm thấy (nếu có)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Body không phải JSON FHIR hợp lệ
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: $validate
      tags:
      - operation
  /fhir/R4/{resourceType}/_search:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Tương đương GET /fhir/R4/{resourceType} nhưng tham số đi trong
        body form-urlencoded, dùng khi query string quá dài. Cũng nhận mọi search
        param của loại resource.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: 'Số kết quả mỗi trang. Ví dụ: 10'
        in: formData
        name: _count
        type: integer
      - description: Vị trí bắt đầu (phân trang)
        in: formData
        name: _offset
        type: integer
      - description: 'Sắp xếp, phân cách bằng dấu phẩy; tiền tố - để giảm dần. Ví
          dụ: -_lastUpdated,family'
        in: formData
        name: _sort
        type: string
      - description: Cách tính tổng
        enum:
        - none
        - estimate
        - accurate
        in: formData
        name: _total
        type: string
      - description: Rút gọn kết quả
        enum:
        - "true"
        - text
        - data
        - count
        - "false"
        in: formData
        name: _summary
        type: string
      - description: Chỉ trả các phần tử này, phân cách bằng dấu phẩy
        in: formData
        name: _elements
        type: string
      - description: 'Kèm resource được tham chiếu. Ví dụ: Observation:subject'
        in: formData
        name: _include
        type: string
      - description: 'Kèm resource tham chiếu tới kết quả. Ví dụ: Observation:subject'
        in: formData
        name: _revinclude
        type: string
      - description: Lọc theo id (nhiều giá trị cách nhau bằng dấu phẩy)
        in: formData
        name: _id
        type: string
      - description: 'Lọc theo thời điểm cập nhật, hỗ trợ tiền tố ge/le/gt/lt. Ví
          dụ: ge2026-01-01'
        in: formData
        name: _lastUpdated
        type: string
      - description: Biểu thức _filter của FHIR
        in: formData
        name: _filter
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Bundle'
        "400":
          description: Search param không hợp lệ
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Tìm kiếm dạng form (POST _search)
      tags:
      - fhir
  /fhir/R4/{resourceType}/{id}:
    delete:
      description: 'Xóa mềm: resource vẫn nằm trong _history, đọc lại trả 410. Xóa
        vĩnh viễn dùng $expunge.'
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "204":
          description: No Content
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Xóa resource
      tags:
      - fhir
    get:
      description: 'Hỗ trợ If-None-Match (ETag) và If-Modified-Since: trả 304 nếu
        không đổi.'
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: Header ETag = W/\"versionId\
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "304":
          description: Không đổi so với If-None-Match / If-Modified-Since
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "410":
          description: Đã bị xóa
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đọc resource
      tags:
      - fhir
    patch:
      consumes:
      - application/json-patch+json
      description: Body là mảng thao tác RFC 6902; Content-Type bắt buộc application/json-patch+json.
        Hỗ trợ If-Match.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      - description: Các thao tác JSON Patch
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/httpapi.JSONPatchOp'
          type: array
      - description: ETag phiên bản đang sửa
        in: header
        name: If-Match
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: Đã patch; header ETag mới
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "400":
          description: Patch sai cú pháp hoặc kết quả không hợp lệ
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "412":
          description: If-Match không khớp phiên bản hiện tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "415":
          description: Content-Type không phải application/json-patch+json
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Patch resource (JSON Patch)
      tags:
      - fhir
    put:
      consumes:
      - application/fhir+json
      description: Hỗ trợ If-Match (versionId) và update-as-create nếu bật. Body phải
        có id khớp với đường dẫn.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      - description: Resource (mẫu là Patient)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.PatientBody'
      - description: ETag phiên bản đang sửa, ví dụ W/\
        in: header
        name: If-Match
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: Đã cập nhật; header ETag mới
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "201":
          description: Tạo mới (update-as-create)
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "400":
          description: Sai cấu trúc hoặc id không khớp
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại và update-as-create đang tắt
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "412":
          description: If-Match không khớp phiên bản hiện tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Cập nhật resource
      tags:
      - fhir
  /fhir/R4/{resourceType}/{id}/$expunge:
    post:
      description: Cần quyền admin. Xóa vĩnh viễn resource cùng mọi phiên bản, không
        hoàn tác.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền admin)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: $expunge (xóa vĩnh viễn)
      tags:
      - operation
  /fhir/R4/{resourceType}/{id}/$reindex:
    post:
      description: Cần quyền admin. Chạy ngay trong request, trả khi xong.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền admin)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: $reindex một resource (đồng bộ)
      tags:
      - operation
  /fhir/R4/{resourceType}/{id}/_history:
    get:
      description: Trả Bundle type history, phiên bản mới nhất trước. Gồm cả phiên
        bản đã xóa.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      - description: 'Số phiên bản mỗi trang. Ví dụ: 10'
        in: query
        name: _count
        type: integer
      - description: Vị trí bắt đầu
        in: query
        name: _offset
        type: integer
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Bundle'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Lịch sử các phiên bản
      tags:
      - fhir
  /fhir/R4/{resourceType}/{id}/_history/{vid}:
    get:
      description: Đọc đúng phiên bản vid của resource.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      - description: versionId
        in: path
        name: vid
        required: true
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không có phiên bản này
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "410":
          description: Phiên bản là bản xóa
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đọc một phiên bản
      tags:
      - fhir
  /fhir/R4/CodeSystem/$lookup:
    get:
      description: 'Tra cứu thông tin một code trong CodeSystem: display, definition,
        property.'
      parameters:
      - description: URL của CodeSystem
        in: query
        name: system
        required: true
        type: string
      - description: Code cần tra
        in: query
        name: code
        required: true
        type: string
      - description: Phiên bản CodeSystem
        in: query
        name: version
        type: string
      - description: Property cần trả, lặp tham số để chọn nhiều
        in: query
        name: property
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Parameters'
        "400":
          description: Thiếu system hoặc code
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tìm thấy code
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: CodeSystem/$lookup
      tags:
      - terminology
  /fhir/R4/Patient/{id}/$everything:
    get:
      description: Trả Bundle gồm hồ sơ Patient và các resource thuộc compartment
        của bệnh nhân đó.
      parameters:
      - description: Patient id
        in: path
        name: id
        required: true
        type: string
      - description: 'Số resource mỗi trang. Ví dụ: 10'
        in: query
        name: _count
        type: integer
      - description: Chỉ lấy resource cập nhật từ thời điểm này
        in: query
        name: _since
        type: string
      - description: Chỉ lấy các loại resource này, phân cách bằng dấu phẩy
        in: query
        name: _type
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Bundle'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Patient không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Patient/$everything
      tags:
      - operation
  /fhir/R4/ValueSet/$expand:
    get:
      description: Mở rộng ValueSet thành danh sách code. Terminology còn có $lookup,
        $validate-code, $subsumes, $translate (GET và POST) với cùng dạng đường dẫn.
      parameters:
      - description: Canonical URL của ValueSet, có thể kèm |version
        in: query
        name: url
        required: true
        type: string
      - description: Phiên bản ValueSet (nếu url không có |version)
        in: query
        name: valueSetVersion
        type: string
      - description: Lọc code/display chứa chuỗi này
        in: query
        name: filter
        type: string
      - description: Số code tối đa
        in: query
        name: count
        type: integer
      - description: Vị trí bắt đầu
        in: query
        name: offset
        type: integer
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.ValueSet'
        "400":
          description: Thiếu url hoặc tham số sai
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tìm thấy ValueSet
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: ValueSet/$expand
      tags:
      - terminology
  /fhir/R4/bulkdata/{id}/status:
    delete:
      description: Hủy job export đang chạy.
      parameters:
      - description: Export id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "202":
          description: Đã nhận yêu cầu hủy
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Export không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Hủy bulk export
      tags:
      - bulk
    get:
      description: Poll sau khi $export. 202 là đang chạy (header X-Progress, Retry-After);
        200 là đã xong kèm manifest các tệp NDJSON; mỗi url trong output tải qua GET
        (cần token).
      parameters:
      - description: Export id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: Đã xong
          schema:
            $ref: '#/definitions/httpapi.ExportManifest'
        "202":
          description: 'Đang chạy; header X-Progress: in-progress và Retry-After (giây)'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Export không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Trạng thái bulk export
      tags:
      - bulk
  /fhir/R4/job/{id}/status:
    get:
      description: 'Trạng thái của job tạo bởi $reindex (và các job nền khác): accepted,
        in-progress, completed hoặc error, kèm kết quả trong Parameters.'
      parameters:
      - description: Job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Parameters'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Job không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Trạng thái job nền
      tags:
      - operation
  /fhir/R4/metadata:
    get:
      description: 'Mô tả server: các loại resource, interaction, search param và
        operation được hỗ trợ. Công khai, không cần token.'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.CapabilityStatement'
      summary: CapabilityStatement
      tags:
      - fhir
  /healthz:
    get:
      description: Tiến trình còn sống; luôn 200 khi server chạy. Không kiểm phụ thuộc
        nên orchestrator không khởi động lại tiến trình vì lỗi DB hay Redis.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: 200 khi nhận được lưu lượng; 503 khi đang tắt (drain) hoặc một
        phụ thuộc hỏng (database trong READINESS_TIMEOUT, broker khi bật Subscription).
        Body cho biết từng phụ thuộc.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
      summary: Readiness probe (kiểm tra phụ thuộc)
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Dạng "Bearer <token>". Vai trò: read (GET, _search, operation không
      ghi), write (ghi, batch), admin ($reindex, $expunge). /fhir/R4/metadata công
      khai.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 'FHIR R4 REST: CRUD, search, history, batch/transaction, GraphQL, metadata
    (CapabilityStatement). Lỗi trả OperationOutcome (application/fhir+json).'
  name: fhir
- description: Operation FHIR ($validate, $everything, $reindex, $expunge) và trạng
    thái job nền. $reindex và $expunge cần quyền admin.
  name: operation
- description: 'Terminology cơ bản: ValueSet/$expand và CodeSystem/$lookup.'
  name: terminology
- description: 'Bulk Data Access: $export bất đồng bộ, theo dõi trạng thái và hủy;
    tệp kết quả là NDJSON tải qua Binary.'
  name: bulk
- description: Probe liveness và readiness cho orchestrator (ngoài /fhir/R4, lỗi dạng
    JSON thường).
  name: health
