        chỉ ProjectMembership/<id> hoặc tham chiếu profile của thành viên đích (cùng
        project). scope mặc định là openid cộng các scope SMART của người gọi; người
        gọi bị giới hạn SMART chỉ mint được trong phạm vi của mình. Mã chỉ trả MỘT
        lần (kho giữ SHA-256); đổi mã ở /oauth2/token (grant pre-authorized_code).
      parameters:
      - description: ProjectMembership/<id> hoặc profile của đích
        in: header
        name: X-Medplum-On-Behalf-Of
        required: true
        type: string
      - description: Client và tham số
        in: body
        name: body
        required: true
