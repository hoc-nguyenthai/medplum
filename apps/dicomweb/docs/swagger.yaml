basePath: /
definitions:
  httpapi.ErrorBody:
    properties:
      error:
        description: thông điệp lỗi; lỗi 5xx chỉ là mô tả trạng thái chuẩn
        example: Token không hợp lệ
        type: string
    required:
    - error
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        description: luôn "ok" khi tiến trình còn sống
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: boolean
        description: kết quả từng phụ thuộc (database)
        type: object
      ready:
        description: true khi mọi phụ thuộc chính sẵn sàng và không đang tắt
        example: true
        type: boolean
    required:
    - checks
    - ready
    type: object
info:
  contact: {}
  description: 'DICOMweb (STOW-RS, QIDO-RS, WADO-RS) cho kho hình ảnh DICOM, dùng
    chung schema và kho Binary với fhir-server. Lỗi trả {"error": "..."}. Hiện chỉ
    có khung: mọi route DICOMweb trả 501 cho tới khi STOW-RS (D3) và QIDO-RS, WADO-RS
    (D4) được cài.'
  title: Trivita DICOMweb API
  version: "1.0"
paths:
  /dicomweb/studies:
    get:
      description: Sẽ trả danh sách study dạng DICOM JSON (D4). Cần quyền đọc.
      produces:
      - application/json
      responses:
        "200":
          description: 'Chưa dùng: route này hiện luôn trả 501'
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền (cần quyền đọc) hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "501":
          description: Chưa cài đặt
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm study (chưa cài)'
      tags:
      - dicomweb
    post:
      description: Sẽ nhận multipart/related (application/dicom) và lưu từng instance
        (D3). Cần quyền ghi. Mọi route DICOMweb khác không liệt kê ở đây (instances,
        rendered, bulkdata, xóa...) cũng trả 501 sau xác thực.
      produces:
      - application/json
      responses:
        "200":
          description: 'Chưa dùng: route này hiện luôn trả 501'
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền (cần quyền ghi) hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "413":
          description: Body vượt DICOMWEB_MAX_REQUEST_BYTES
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "501":
          description: Chưa cài đặt
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'STOW-RS: lưu instance (chưa cài)'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}:
    post:
      description: Như STOW-RS ở /studies nhưng ràng buộc mọi instance vào study chỉ
        định (D3). Cần quyền ghi.
      parameters:
      - description: UID của study (DICOM StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Chưa dùng: route này hiện luôn trả 501'
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền (cần quyền ghi) hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "413":
          description: Body vượt DICOMWEB_MAX_REQUEST_BYTES
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "501":
          description: Chưa cài đặt
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'STOW-RS: lưu instance vào một study (chưa cài)'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series:
    get:
      description: Sẽ trả danh sách series của một study dạng DICOM JSON (D4). Cần
        quyền đọc.
      parameters:
      - description: UID của study (DICOM StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Chưa dùng: route này hiện luôn trả 501'
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền (cần quyền đọc) hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "501":
          description: Chưa cài đặt
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm series của study (chưa cài)'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/frames/{frame}:
    get:
      description: Sẽ trả một frame dạng multipart/related, truyền luồng từ kho (D4).
        Cần quyền đọc.
      parameters:
      - description: UID của study (DICOM StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      - description: Số thứ tự frame, bắt đầu từ 1
        in: path
        name: frame
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Chưa dùng: route này hiện luôn trả 501'
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền (cần quyền đọc) hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "501":
          description: Chưa cài đặt
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: lấy frame (chưa cài)'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/metadata:
    get:
      description: Sẽ trả metadata mọi instance của series dạng DICOM JSON (D4). Cần
        quyền đọc.
      parameters:
      - description: UID của study (DICOM StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Chưa dùng: route này hiện luôn trả 501'
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền (cần quyền đọc) hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "501":
          description: Chưa cài đặt
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: metadata của series (chưa cài)'
      tags:
      - dicomweb
  /health/live:
    get:
      description: Tiến trình còn sống; không kiểm phụ thuộc ngoài để orchestrator
        không restart pod vì lỗi của cơ sở dữ liệu.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: 'Sẵn sàng nhận yêu cầu: cơ sở dữ liệu trả lời trong READINESS_TIMEOUT.
        503 khi đang tắt (SIGTERM) hoặc phụ thuộc lỗi.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
        "503":
          description: Chưa sẵn sàng hoặc đang tắt
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
  /health/startup:
    get:
      description: Đã khởi động xong (route đã sẵn sàng); không kiểm phụ thuộc ngoài.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Startup probe
      tags:
      - health
  /healthz:
    get:
      description: Giống liveness; dùng cho HEALTHCHECK của image (`/app healthcheck`).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Healthcheck của Docker
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Dạng "Bearer <access_token>": JWT do auth cấp (kiểm bằng JWKS),
      có claim project. Đọc (QIDO, WADO) cần quyền đọc, ghi (STOW) cần quyền ghi.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 'DICOMweb. Bốn tiền tố tương đương: /dicomweb, /api/dicomweb, /projects/{projectId}/dicomweb,
    /api/projects/{projectId}/dicomweb; với hai tiền tố có project, projectId phải
    khớp project của token (token thường), không thì 403. Spec này liệt kê tiền tố
    /dicomweb.'
  name: dicomweb
- description: Probe liveness, startup và readiness cho orchestrator.
  name: health
