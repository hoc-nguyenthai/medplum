basePath: /
definitions:
  application.AdminProjectView:
    properties:
      id:
        description: id của Project (UUID)
        example: 0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a44
        type: string
      name:
        description: tên Project
        example: Bệnh viện A
        type: string
      secret:
        description: các secret của Project; giá trị luôn bị che (maskValue), chỉ
          có khi có secret
        items:
          $ref: '#/definitions/fhir.ProjectSetting'
        type: array
      setting:
        description: cấu hình Project; giá trị bí mật bị che, chỉ có khi Project có
          cấu hình
        items:
          $ref: '#/definitions/fhir.ProjectSetting'
        type: array
      site:
        description: các site của Project; googleClientSecret bị che, chỉ có khi Project
          có site
        items:
          $ref: '#/definitions/fhir.ProjectSite'
        type: array
    required:
    - id
    - name
    type: object
  application.LoginResult:
    properties:
      allowedMfaMethods:
        description: phương thức MFA project cho phép đăng ký; chỉ có khi mfaEnrollRequired
        example:
        - totp
        items:
          enum:
          - totp
          - email
          type: string
        type: array
      code:
        description: authorization code (hạn mặc định 10 phút); chỉ có ở dạng "code"
          và đi kèm cookie đăng nhập
        example: 4f9c2e7a1b3d5f60a8c1e2d3b4a59687
        type: string
      email:
        description: email của người dùng; chỉ có khi mfaRequired
        example: user@example.com
        type: string
      enrollQrCode:
        description: mã QR của enrollUri dạng data URI; chỉ có khi mfaEnrollRequired
        type: string
      enrollUri:
        description: otpauth URI để đăng ký TOTP; chỉ có khi mfaEnrollRequired
        example: otpauth://totp/Trivita:user@example.com?secret=JBSWY3DPEHPK3PXP
        type: string
      login:
        description: id của Login (UUID); luôn có, dùng cho các bước tiếp theo
        example: 0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a66
        type: string
      memberships:
        description: các profile để chọn khi người dùng có nhiều membership; chỉ có
          ở dạng "memberships"
        items:
          $ref: '#/definitions/application.MembershipChoice'
        type: array
      mfaEnrollRequired:
        description: 'true ở dạng "mfaEnrollRequired": người dùng phải đăng ký MFA
          trước'
        example: true
        type: boolean
      mfaMethods:
        description: phương thức MFA người dùng đã đăng ký; chỉ có khi mfaRequired
        example:
        - totp
        items:
          enum:
          - totp
          - email
          type: string
        type: array
      mfaRequired:
        description: 'true ở dạng "mfaRequired": cần xác thực MFA trước khi có code'
        example: true
        type: boolean
    required:
    - login
    type: object
  application.MFAStatusResult:
    properties:
      allowedMethods:
        description: các phương thức MFA project cho phép
        example:
        - totp
        items:
          enum:
          - totp
          - email
          type: string
        type: array
      email:
        description: email của tài khoản (luôn được điền nếu user có email)
        example: user@example.com
        type: string
      enrollQrCode:
        description: mã QR của enrollUri dạng data URI; chỉ có khi người dùng chưa
          đăng ký TOTP
        type: string
      enrollUri:
        description: otpauth URI để đăng ký TOTP; chỉ có khi người dùng chưa đăng
          ký TOTP
        example: otpauth://totp/Trivita:user@example.com?secret=JBSWY3DPEHPK3PXP
        type: string
      enrolled:
        description: người dùng đã đăng ký ít nhất một phương thức MFA
        example: false
        type: boolean
      enrolledMethods:
        description: các phương thức MFA đã đăng ký
        example:
        - totp
        items:
          enum:
          - totp
          - email
          type: string
        type: array
      mfaRequired:
        description: project có bắt buộc MFA hay không
        example: false
        type: boolean
    required:
    - allowedMethods
    - enrolled
    - enrolledMethods
    - mfaRequired
    type: object
  application.Me:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/fhir.UserConfiguration'
        description: cấu hình giao diện của người dùng
      membership:
        allOf:
        - $ref: '#/definitions/fhir.ProjectMembership'
        description: ProjectMembership của phiên
      profile:
        additionalProperties:
          type: string
        description: profile chỉ gồm resourceType và id (rỗng nếu membership không
          có profile)
        type: object
      project:
        allOf:
        - $ref: '#/definitions/fhir.Project'
        description: Project của phiên (id, name, features, ...)
      security:
        allOf:
        - $ref: '#/definitions/application.UserSecurity'
        description: thông tin bảo mật (MFA, phiên, membership); chỉ có khi login
          không bị giới hạn bởi SMART resource scope
      user:
        allOf:
        - $ref: '#/definitions/fhir.User'
        description: người dùng (id, email, identifier); chỉ có khi membership trỏ
          tới User
    required:
    - config
    - membership
    - profile
    - project
    type: object
  application.MembershipChoice:
    properties:
      id:
        description: id của ProjectMembership (UUID)
        example: 0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a55
        type: string
      identifier:
        description: định danh của membership, nếu có
        items:
          $ref: '#/definitions/fhir.Identifier'
        type: array
      profile:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: tham chiếu profile (Practitioner/Patient/RelatedPerson) của membership
      project:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: tham chiếu Project (display là tên hiện tại); vắng khi không
          đọc được project
    required:
    - id
    type: object
  application.MethodResult:
    properties:
      authorizeUrl:
        description: URL authorize của identity provider; vắng mặt nghĩa là đăng nhập
          bằng mật khẩu
        example: https://idp.example.com/oauth2/authorize
        type: string
      domain:
        description: tên miền của email, chỉ có khi tên miền cấu hình identity provider
          ngoài
        example: example.com
        type: string
    type: object
  application.PreAuthorizeResult:
    properties:
      expiresAt:
        description: thời điểm hết hạn của mã, RFC3339 UTC (now + ttl giây)
        example: "2026-11-23T10:15:00.000Z"
        format: date-time
        type: string
      preAuthorizedCode:
        description: mã pre-authorized dùng một lần để đổi token; chỉ trả ở lần này
          (server chỉ lưu băm)
        example: 4f9c2e7a1b3d5f60a8c1e2d3b4a59687
        type: string
    required:
    - expiresAt
    - preAuthorizedCode
    type: object
  application.RegisteredClient:
    properties:
      client_id:
        description: id của client dựng sẵn khớp redirect_uri
        example: 0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a77
        type: string
      client_id_issued_at:
        description: thời điểm trả về, Unix epoch tính bằng giây
        example: 1795428900
        type: integer
      redirect_uris:
        description: redirect URI khớp (đúng một phần tử)
        example:
        - https://app.example.com/callback
        items:
          type: string
        type: array
    required:
    - client_id
    - client_id_issued_at
    - redirect_uris
    type: object
  application.Session:
    properties:
      authMethod:
        description: phương thức đăng nhập của phiên
        enum:
        - password
        - google
        - external
        - exchange
        - client
        - pre-authorized
        example: password
        type: string
      browser:
        description: trình duyệt suy ra từ user agent, nếu có
        example: Chrome
        type: string
      id:
        description: id của Login (UUID) đại diện cho phiên
        example: 0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a66
        type: string
      lastUpdated:
        description: thời điểm cập nhật cuối của Login (meta.lastUpdated), RFC3339
        example: "2026-11-23T10:15:00.000Z"
        format: date-time
        type: string
      os:
        description: hệ điều hành suy ra từ user agent, nếu có
        example: macOS
        type: string
      project:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: tham chiếu Project của phiên, nếu có
      remoteAddress:
        description: địa chỉ IP lúc đăng nhập, nếu có
        example: 203.0.113.10
        type: string
    required:
    - authMethod
    - id
    - lastUpdated
    type: object
  application.UserSecurity:
    properties:
      memberships:
        description: các membership của người dùng
        items:
          $ref: '#/definitions/fhir.ProjectMembership'
        type: array
      mfaEnrolled:
        description: người dùng đã đăng ký MFA
        example: false
        type: boolean
      mfaRequired:
        description: project hiện tại bắt buộc MFA
        example: false
        type: boolean
      sessions:
        description: các phiên đăng nhập của người dùng
        items:
          $ref: '#/definitions/application.Session'
        type: array
    required:
    - memberships
    - mfaEnrolled
    - mfaRequired
    - sessions
    type: object
  fhir.AnyResource:
    properties:
      value: {}
    type: object
  fhir.Attachment:
    properties:
      _contentType:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của contentType
      _creation:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của creation
      _data:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của data
      _hash:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của hash
      _id:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của id
      _language:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của language
      _size:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của size
      _title:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của title
      _url:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của url
      contentType:
        description: Mime type of the content, with charset etc.
        type: string
      creation:
        description: Date attachment was first created
        type: string
      data:
        description: Data inline, base64ed
        type: string
      extension:
        description: Additional content defined by implementations
        items:
          type: object
        type: array
      hash:
        description: Hash of the data (sha-1, base64ed)
        type: string
      id:
        description: Unique id for inter-element referencing
        type: string
      language:
        description: Human language of the content (BCP-47)
        type: string
      size:
        description: Number of bytes of content (if url provided)
        type: integer
      title:
        description: Label to display in place of the data
        type: string
      url:
        description: Uri where the data can be found
        type: string
    type: object
  fhir.ClientApplication:
    properties:
      _accessTokenLifetime:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của accessTokenLifetime
      _allowedOrigin:
        description: Phần mở rộng của allowedOrigin
        items:
          $ref: '#/definitions/fhir.Element'
        type: array
      _certificateTrustStore:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của certificateTrustStore
      _defaultScope:
        description: Phần mở rộng của defaultScope
        items:
          $ref: '#/definitions/fhir.Element'
        type: array
      _description:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của description
      _grantType:
        description: Phần mở rộng của grantType
        items:
          $ref: '#/definitions/fhir.Element'
        type: array
      _id:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của id
      _implicitRules:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của implicitRules
      _jwksUri:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của jwksUri
      _language:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của language
      _launchUri:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của launchUri
      _name:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của name
      _pkceOptional:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của pkceOptional
      _redirectUri:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của redirectUri
      _redirectUris:
        description: Phần mở rộng của redirectUris
        items:
          $ref: '#/definitions/fhir.Element'
        type: array
      _refreshTokenLifetime:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của refreshTokenLifetime
      _responseType:
        description: Phần mở rộng của responseType
        items:
          $ref: '#/definitions/fhir.Element'
        type: array
      _retiringSecret:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của retiringSecret
      _secret:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của secret
      _status:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của status
      accessTokenLifetime:
        description: accessTokenLifetime
        type: string
      allowedOrigin:
        description: allowedOrigin
        items:
          type: string
        type: array
      certificateTrustStore:
        description: certificateTrustStore
        type: string
      contained:
        description: Contained, inline Resources
        items:
          $ref: '#/definitions/fhir.AnyResource'
        type: array
      defaultScope:
        description: defaultScope
        items:
          type: string
        type: array
      description:
        description: description
        type: string
      extension:
        description: Additional content defined by implementations
        items:
          type: object
        type: array
      grantType:
        description: grantType
        items:
          type: string
        type: array
      id:
        description: Logical id of this artifact
        type: string
      identityProvider:
        allOf:
        - $ref: '#/definitions/fhir.IdentityProvider'
        description: identityProvider
      implicitRules:
        description: implicitRules
        type: string
      jwksUri:
        description: jwksUri
        type: string
      language:
        description: language
        type: string
      launchIdentifierSystems:
        description: launchIdentifierSystems
        items:
          $ref: '#/definitions/fhir.ClientApplicationLaunchIdentifierSystems'
        type: array
      launchUri:
        description: launchUri
        type: string
      meta:
        allOf:
        - $ref: '#/definitions/fhir.Meta'
        description: meta
      modifierExtension:
        description: Extensions that cannot be ignored
        items:
          type: object
        type: array
      name:
        description: name
        type: string
      pkceOptional:
        description: pkceOptional
        type: boolean
      redirectUri:
        description: redirectUri
        type: string
      redirectUris:
        description: redirectUris
        items:
          type: string
        type: array
      refreshTokenLifetime:
        description: refreshTokenLifetime
        type: string
      resourceType:
        type: string
      responseType:
        description: responseType
        items:
          type: string
        type: array
      retiringSecret:
        description: retiringSecret
        type: string
      secret:
        description: secret
        type: string
      signInForm:
        allOf:
        - $ref: '#/definitions/fhir.ClientApplicationSignInForm'
        description: signInForm
      status:
        description: active | error | off
        type: string
      text:
        allOf:
        - $ref: '#/definitions/fhir.Narrative'
        description: Text summary of the resource, for human interpretation
    type: object
  fhir.ClientApplicationLaunchIdentifierSystems:
    properties:
      _resourceType:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của resourceType
      _system:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của system
      resourceType:
        description: resourceType (bắt buộc)
        type: string
      system:
        description: system (bắt buộc)
        type: string
    type: object
  fhir.ClientApplicationSignInForm:
    properties:
      _showScopeSelection:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của showScopeSelection
      _welcomeString:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của welcomeString
      logo:
        allOf:
        - $ref: '#/definitions/fhir.Attachment'
        description: logo
      showScopeSelection:
        description: showScopeSelection
        type: boolean
      welcomeString:
        description: welcomeString
        type: string
    type: object
  fhir.CodeableConcept:
    properties:
      _id:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của id
      _text:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của text
      coding:
        description: Code defined by a terminology system
        items:
          $ref: '#/definitions/fhir.Coding'
        type: array
      extension:
        description: Additional content defined by implementations
        items:
          type: object
        type: array
      id:
        description: Unique id for inter-element referencing
        type: string
      text:
        description: Plain text representation of the concept
        type: string
    type: object
  fhir.Coding:
    properties:
      _code:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của code
      _display:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của display
      _id:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của id
      _system:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của system
      _userSelected:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của userSelected
      _version:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của version
      code:
        description: Symbol in syntax defined by the system
        type: string
      display:
        description: Representation defined by the system
        type: string
      extension:
        description: Additional content defined by implementations
        items:
          type: object
        type: array
      id:
        description: Unique id for inter-element referencing
        type: string
      system:
        description: Identity of the terminology system
        type: string
      userSelected:
        description: If this coding was chosen directly by the user
        type: boolean
      version:
        description: Version of the system - if relevant
        type: string
    type: object
  fhir.Element:
    properties:
      _id:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của id
      extension:
        description: Additional content defined by implementations
        items:
          type: object
        type: array
      id:
        description: Unique id for inter-element referencing
        type: string
    type: object
  fhir.Identifier:
    properties:
      _id:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của id
      _system:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của system
      _use:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của use
      _value:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của value
      assigner:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: Organization that issued id (may be just text)
      extension:
        description: Additional content defined by implementations
        items:
          type: object
        type: array
      id:
        description: Unique id for inter-element referencing
        type: string
      period:
        allOf:
        - $ref: '#/definitions/fhir.Period'
        description: Time period when id is/was valid for use
      system:
        description: The namespace for the identifier value
        type: string
      type:
        allOf:
        - $ref: '#/definitions/fhir.CodeableConcept'
        description: Description of identifier
      use:
        description: usual | official | temp | secondary | old (If known)
        type: string
      value:
        description: The value that is unique
        type: string
    type: object
  fhir.IdentityProvider:
    properties:
      _audience:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của audience
      _authorizeUrl:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của authorizeUrl
      _clientId:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của clientId
      _clientSecret:
        allOf:
        - $ref: '#/definitions/fhir.Element'
        description: Phần mở rộng của clientSecret
