basePath: /
definitions:
  httpapi.DicomJSONElement:
    properties:
      BulkDataURI:
        description: URI lấy dữ liệu nhị phân lớn
        type: string
      InlineBinary:
        description: dữ liệu nhị phân nhỏ dạng base64
        example: AQID
        type: string
      Value:
        description: 'danh sách giá trị: chuỗi, số, tên người ({"Alphabetic": ...})
          hoặc dataset (phần tử của SQ)'
        items: {}
        type: array
      vr:
        description: Value Representation của phần tử
        enum:
        - AE
        - AS
        - AT
        - CS
        - DA
        - DS
        - DT
        - FL
        - FD
        - IS
        - LO
        - LT
        - OB
        - OD
        - OF
        - OL
        - OV
        - OW
        - PN
        - SH
        - SL
        - SQ
        - SS
        - ST
        - SV
        - TM
        - UC
        - UI
        - UL
        - UN
        - UR
        - US
        - UT
        - UV
        example: UI
        type: string
    required:
    - vr
    type: object
  httpapi.ErrorBody:
    properties:
      error:
        description: thông điệp lỗi; lỗi 5xx chỉ là mô tả trạng thái chuẩn
        example: Token không hợp lệ
        type: string
    required:
    - error
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        description: luôn "ok" khi tiến trình còn sống
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: boolean
        description: kết quả từng phụ thuộc (database)
        type: object
      ready:
        description: true khi mọi phụ thuộc chính sẵn sàng và không đang tắt
        example: true
        type: boolean
    required:
    - checks
    - ready
    type: object
  httpapi.StowResponse:
    additionalProperties:
      $ref: '#/definitions/httpapi.DicomJSONElement'
    type: object
info:
  contact: {}
  description: 'DICOMweb (STOW-RS, QIDO-RS, WADO-RS) cho kho hình ảnh DICOM, dùng
    chung schema và kho Binary với fhir-server. Lỗi trả {"error": "..."}. STOW-RS
    (D3), QIDO-RS (tìm study, series) và WADO-RS (metadata series, frame) (D4) đã
    cài; các route DICOMweb còn lại trả 501.'
  title: Trivita DICOMweb API
  version: "1.0"
paths:
  /dicomweb/studies:
    get:
      description: 'Trả các study của project (mới cập nhật trước) dạng DICOM JSON.
        Hiện chỉ hỗ trợ phân trang (limit, offset); bộ lọc theo thuộc tính (PatientID,
        StudyDate...) chưa có và các tham số khác bị bỏ qua. Khi còn kết quả có header
        `Warning: 299`. Không có kết quả thì 200 với []. Cần quyền đọc.'
      parameters:
      - description: Cỡ trang (mặc định 100, tối đa 1000); giá trị hỏng dùng mặc định
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua; giá trị hỏng coi là 0
        in: query
        name: offset
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm study'
      tags:
      - dicomweb
    post:
      consumes:
      - multipart/related
      description: 'Thân là multipart/related; type="application/dicom" (mỗi phần
        là một tệp DICOM Part 10), truyền luồng: phần đầu (tối đa DICOMWEB_MAX_HEADER_BYTES)
        được kiểm tra, nội dung ghi vào kho Binary dùng chung với fhir-server, metadata
        thành DicomStudy, DicomSeries, DicomInstance (tìm được qua API FHIR). Tải
        lại cùng SOPInstanceUID là idempotent. Từng instance được xử lý độc lập: 200
        khi mọi instance thành công, 202 khi một phần (kèm FailedSOPSequence), 409
        khi không instance nào thành công. Instance hỏng, bị cắt giữa PixelData, SQ
        lồng quá sâu, vượt DICOMWEB_MAX_INSTANCE_BYTES bị từ chối riêng và không để
        lại gì. Cần quyền ghi.'
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mọi instance đã lưu
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "202":
          description: 'Một phần: có cả ReferencedSOPSequence và FailedSOPSequence'
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "400":
          description: Thân multipart sai, thiếu boundary hoặc không có phần nào
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "409":
          description: Không instance nào được lưu (FailedSOPSequence nêu lý do từng
            instance)
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "413":
          description: Body vượt DICOMWEB_MAX_REQUEST_BYTES
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "415":
          description: Content-Type không phải multipart/related
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'STOW-RS: lưu instance'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}:
    post:
      consumes:
      - multipart/related
      description: Như STOW-RS ở /studies nhưng mọi instance phải thuộc study chỉ
        định; instance của study khác bị từ chối riêng với FailureReason 0xA900. Cần
        quyền ghi.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mọi instance đã lưu
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "202":
          description: 'Một phần: có cả ReferencedSOPSequence và FailedSOPSequence'
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "400":
          description: Thân multipart sai, thiếu boundary hoặc không có phần nào
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "409":
          description: Không instance nào được lưu
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "413":
          description: Body vượt DICOMWEB_MAX_REQUEST_BYTES
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "415":
          description: Content-Type không phải multipart/related
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'STOW-RS: lưu instance vào một study'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series:
    get:
      description: Trả các series của study dạng DICOM JSON, mỗi phần tử gồm cả thuộc
        tính của study. Cần quyền đọc.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: Cỡ trang (mặc định 100, tối đa 1000); giá trị hỏng dùng mặc định
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua; giá trị hỏng coi là 0
        in: query
        name: offset
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Study hoặc series không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm series của study'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/frames/{frame}:
    get:
      description: 'Trả một hoặc nhiều frame dạng multipart/related (có Content-Length),
        chép theo luồng từ nội dung đã lưu (bộ nhớ hằng số). Content-Type của phần:
        application/octet-stream với dữ liệu không nén, image/jpeg, image/jls, image/jp2,
        image/jpx, image/jphc kèm transfer-syntax với dữ liệu nén. Frame đóng gói
        nhiều fragment được nối lại. Chi phí mỗi yêu cầu tỉ lệ với vị trí frame trong
        tệp (và cả tệp với ảnh nén) cho tới khi worker D5 tách sẵn frame. Cần quyền
        đọc, gồm cả quyền đọc Binary.'
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      - description: Số thứ tự frame bắt đầu từ 1, hoặc danh sách cách nhau bằng dấu
          phẩy (1,2,3; tối đa 50)
        in: path
        name: frame
        required: true
        type: string
      produces:
      - multipart/related
      - application/json
      responses:
        "200":
          description: 'multipart/related: mỗi phần là một frame'
          schema:
            type: file
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Study, series, instance không có, hoặc instance không có ảnh
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "416":
          description: Số frame vượt tổng số frame của instance
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: lấy frame'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/metadata:
    get:
      description: Trả mảng metadata DICOM JSON của mọi instance trong series, theo
        luồng (không bị cắt ở 1000 instance như Medplum). Study hoặc series không
        có thì 404 trước khi ghi byte nào; lỗi giữa chừng thì ngắt kết nối. Cần quyền
        đọc.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Study hoặc series không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: metadata của series'
      tags:
      - dicomweb
  /health/live:
    get:
      description: Tiến trình còn sống; không kiểm phụ thuộc ngoài để orchestrator
        không restart pod vì lỗi của cơ sở dữ liệu.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: 'Sẵn sàng nhận yêu cầu: cơ sở dữ liệu trả lời trong READINESS_TIMEOUT.
        503 khi đang tắt (SIGTERM) hoặc phụ thuộc lỗi.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
        "503":
          description: Chưa sẵn sàng hoặc đang tắt
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
  /health/startup:
    get:
      description: Đã khởi động xong (route đã sẵn sàng); không kiểm phụ thuộc ngoài.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Startup probe
      tags:
      - health
  /healthz:
    get:
      description: Giống liveness; dùng cho HEALTHCHECK của image (`/app healthcheck`).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Healthcheck của Docker
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Dạng "Bearer <access_token>": JWT do auth cấp (kiểm bằng JWKS),
      có claim project. Đọc (QIDO, WADO) cần quyền đọc, ghi (STOW) cần quyền ghi.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 'DICOMweb. Bốn tiền tố tương đương: /dicomweb, /api/dicomweb, /projects/{projectId}/dicomweb,
    /api/projects/{projectId}/dicomweb; với hai tiền tố có project, projectId phải
    khớp project của token (token thường), không thì 403. Spec này liệt kê tiền tố
    /dicomweb.'
  name: dicomweb
- description: Probe liveness, startup và readiness cho orchestrator.
  name: health
