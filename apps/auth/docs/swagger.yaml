      tags:
      - auth
  /auth/clientinfo/{clientId}:
    get:
      description: Không cần xác thực. redirect_uri (nếu gửi) phải khớp chính xác
        một URI đã đăng ký của client. Toàn bộ signInForm là công khai.
      parameters:
      - description: id client
        in: path
        name: clientId
        required: true
        type: string
      - description: URI chuyển hướng
        in: query
        name: redirect_uri
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.ClientApplicationSignInForm'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Thông tin công khai của form đăng nhập của một client
      tags:
      - auth
  /auth/exchange:
    post:
      consumes:
      - application/json
      description: Vỏ mỏng của grant urn:ietf:params:oauth:grant-type:token-exchange.
        Trả BODY TOKEN (access_token, id_token, refresh_token...), KHÔNG phải LoginResult
        như tài liệu cũ ghi. IdP cấu hình ở máy chủ bắt buộc có membershipId. Lỗi
        validator trả OperationOutcome 400; lỗi IdP và danh tính trả {error, error_description};
        lỗi đăng nhập (user không có...) trả OperationOutcome.
      parameters:
      - description: Token của IdP và client
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ExchangeBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.TokenErrorBody'
      summary: Đổi access token của IdP ngoài lấy token của auth (deprecated)
      tags:
      - auth
  /auth/external:
    get:
      description: 'IdP chuyển trình duyệt về đây với code và state. state phải do
        /auth/method phát (đã ký) và trình duyệt phải mang cookie auth-external-state
        tương ứng. Thành công: 302 tới redirectUri của client kèm login và code, hoặc
        về trang đăng nhập của app kèm login. Lỗi trả OperationOutcome JSON 400 (không
        chuyển hướng). /auth/external/{clientId} là callback riêng của client có identityProvider.'
      parameters:
      - description: Authorization code của IdP
        in: query
        name: code
        required: true
        type: string
      - description: state do /auth/method phát
        in: query
        name: state
        required: true
        type: string
      - description: Issuer (RFC 9207)
        in: query
        name: iss
        type: string
      produces:
      - application/fhir+json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Callback đăng nhập qua identity provider ngoài (OIDC)
      tags:
      - auth
  /auth/external/{clientId}:
    get:
      description: 'IdP chuyển trình duyệt về đây với code và state. state phải do
        /auth/method phát (đã ký) và trình duyệt phải mang cookie auth-external-state
        tương ứng. Thành công: 302 tới redirectUri của client kèm login và code, hoặc
        về trang đăng nhập của app kèm login. Lỗi trả OperationOutcome JSON 400 (không
        chuyển hướng). /auth/external/{clientId} là callback riêng của client có identityProvider.'
      parameters:
      - description: Client có identityProvider riêng (chỉ ở route /auth/external/{clientId};
          route /auth/external không có tham số này)
        in: path
        name: clientId
        required: true
        type: string
      - description: Authorization code của IdP
        in: query
        name: code
        required: true
        type: string
      - description: state do /auth/method phát
        in: query
        name: state
        required: true
        type: string
      - description: Issuer (RFC 9207)
        in: query
        name: iss
        type: string
      produces:
      - application/fhir+json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Callback đăng nhập qua identity provider ngoài (OIDC)
      tags:
      - auth
  /auth/external/start:
    post:
      consumes:
      - application/json
      description: Với client có identityProvider (callback /auth/external/{clientId}).
        Trả {authorizeUrl} đã kèm state do auth ký và đặt cookie liên kết trình duyệt
        auth-external-state; app chuyển người dùng tới authorizeUrl. Đăng nhập theo
        tên miền email dùng /auth/method.
      parameters:
      - description: Client và tham số đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ExternalStartBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.MethodResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Bắt đầu đăng nhập qua identity provider RIÊNG của một client
      tags:
      - auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: Xác minh googleCredential (ID token RS256 của Google, aud là googleClientId)
        rồi đăng nhập. Credential phải báo email đã xác minh. Nếu tên miền của email
        có DomainConfiguration thì trả {domain, authorizeUrl} (kèm cookie state) thay
        vì LoginResult. createUser cho phép tạo user mới từ credential. Thông báo
        lỗi xác minh cố định (không lộ chi tiết).
      parameters:
      - description: Credential của Google
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.GoogleBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Đăng nhập bằng Google Identity Services
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Trả đúng một trong các dạng LoginResult: code (đã chọn được profile),
        memberships (chọn profile), mfaRequired hoặc mfaEnrollRequired. Khi có code
        và login thuộc một client, đặt cookie medplum-<clientId>.'
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.LoginBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Đăng nhập bằng email và mật khẩu
      tags:
      - auth
  /auth/login/{login}:
    get:
      description: Trả LoginResult hiện tại của login (code, memberships, mfaRequired
        hoặc mfaEnrollRequired tùy bước đang dở) để app tiếp tục luồng đăng nhập.
        Id login phải là UUID, sai trả 400, không có login trả 404. Có code và login
        thuộc một client thì đặt cookie medplum-<clientId>.
      parameters:
      - description: Login id (UUID)
        in: path
        name: login
        required: true
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Trạng thái một login đang dở
      tags:
      - auth
  /auth/me:
    get:
      description: profile chỉ có resourceType và id (hồ sơ đầy đủ nằm ở fhir-server);
        accessPolicy chưa có ở bản này.
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.Me'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Thông tin người đang đăng nhập
      tags:
      - auth
  /auth/method:
    post:
      consumes:
      - application/json
      description: 'Trả {} nếu đăng nhập bằng mật khẩu; trả {domain, authorizeUrl}
        nếu tên miền email cấu hình identity provider ngoài. Khi đăng nhập ngoài đã
        bật, authorizeUrl đã kèm `state` do auth ký (chứa các tham số đăng nhập trong
        body) và phản hồi đặt cookie liên kết trình duyệt `auth-external-state`: app
        KHÔNG tự thêm state, chỉ chuyển người dùng tới authorizeUrl. Tên miền trả
        về là chữ thường.'
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MethodBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.MethodResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Cách đăng nhập của một email
      tags:
      - auth
  /auth/mfa/disable:
    post:
      consumes:
      - application/json
      description: Phải chứng minh một yếu tố đang có bằng token (TOTP hoặc mã email).
        Không gỡ được yếu tố cuối khi MFA là bắt buộc. Gỡ TOTP thì secret cũ bị thay
        bằng secret ngẫu nhiên mới. Chịu hạn mức thử như /auth/mfa/verify.
      parameters:
      - description: phương thức (tùy chọn) và token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MFADisableBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Tắt MFA (một phương thức hoặc tất cả)
      tags:
      - auth
  /auth/mfa/enroll:
    post:
      consumes:
      - application/json
      description: 'method=email: token là mã nhận từ /auth/mfa/send-email-challenge.
        method=totp (mặc định): token là mã của secret trong enrollUri của /auth/mfa/status.
        Cũng chịu hạn mức thử như /auth/mfa/verify (lệch có chủ đích so với Medplum).'
      parameters:
      - description: phương thức và token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MFAEnrollBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đăng ký thêm một phương thức MFA cho chính mình
      tags:
      - auth
  /auth/mfa/login-enroll:
    post:
      consumes:
      - application/json
      description: 'Dùng khi MFA bắt buộc mà user chưa đăng ký (phản hồi login có
        mfaEnrollRequired). method=email: đăng ký và gửi mã tới email (nhập mã qua
        /auth/mfa/verify). method=totp (mặc định): gửi token của secret trong enrollUri.
        Cùng hạn mức thử với /auth/mfa/verify.'
      parameters:
      - description: login, phương thức và token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MFALoginEnrollBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Đăng ký MFA ngay trong lúc đăng nhập
      tags:
      - auth
  /auth/mfa/send-email:
    post:
      consumes:
      - application/json
      description: Chỉ cho user đã đăng ký email MFA. Gửi lại ghi đè mã cũ; tối đa
        5 lần mỗi login trong 20 phút.
      parameters:
      - description: login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MFASendEmailBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Gửi (lại) mã MFA qua email cho login đang chờ
      tags:
      - auth
  /auth/mfa/send-email-challenge:
    post:
      description: Để đăng ký email MFA hoặc thỏa yếu tố email khi tắt MFA. Tối đa
        5 lần mỗi login trong 20 phút.
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Gửi mã email cho phiên đang dùng
      tags:
      - auth
  /auth/mfa/status:
    get:
      description: Danh sách phương thức đã đăng ký và được phép, project có bắt buộc
        MFA không, và (nếu chưa đăng ký TOTP) enrollUri cùng enrollQrCode. Secret
        trong enrollUri chỉ thành yếu tố khi chính phiên này xác nhận bằng mã.
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.MFAStatusResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Trạng thái MFA của chính mình
      tags:
      - auth
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: 'Mã TOTP hoặc mã email. Đúng thì login được đánh dấu đã xác minh
        và phản hồi như /auth/login (code, memberships...). Người dùng bắt buộc MFA
        chưa đăng ký mà nhập mã cho secret được mời của chính login này thì được đăng
        ký TOTP luôn. Mỗi lượt thử bị giới hạn: 5 mỗi login và 20 mỗi user trong 10
        phút; lần sai thứ 5 thu hồi login; vượt hạn mức trả 429 kèm rate-limit-reset.
        Mã TOTP chỉ dùng một lần.'
      parameters:
      - description: login và mã
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MFAVerifyBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Xác minh mã MFA khi đăng nhập
      tags:
      - auth
  /auth/newpatient:
    post:
      consumes:
      - application/json
      description: Dùng login từ /auth/newuser của một user thuộc project (projectId
        trong body của newuser). Project phải cho đăng ký mở (setting openPatientRegistration
        và có chính sách Patient). Tạo hồ sơ Patient và membership kèm chính sách
        đó, rồi trả code như /auth/login. Không có hạn mức riêng ngoài hạn mức chung
        của /auth/*.
      parameters:
      - description: login và projectId
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.NewPatientBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Bệnh nhân tự đăng ký vào project
      tags:
      - auth
  /auth/newproject:
    post:
      consumes:
      - application/json
      description: Dùng login từ /auth/newuser. Tạo project (6 chính sách mặc định,
        client mặc định, hồ sơ Practitioner và membership admin) trong một transaction
        rồi trả code như /auth/login. Mọi kiểm tra trạng thái login (đã thu hồi, đã
        cấp code, đã có membership) chạy trước khi tạo project. Login còn thiếu bước
        MFA nhận phản hồi mfaRequired hoặc mfaEnrollRequired và chưa tạo gì.
      parameters:
      - description: login và tên project
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.NewProjectBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Tạo project mới cho người vừa đăng ký
      tags:
      - auth
  /auth/newuser:
    post:
      consumes:
      - application/json
      description: Tạo user rồi tạo Login CHƯA có membership; phản hồi không có code
        (người dùng phải tạo hoặc chọn project/profile tiếp). reCAPTCHA kiểm trước
        cờ đăng ký, như Medplum. projectId là "new" (tạo project mới), id của project
        cho phép đăng ký mở, hoặc bỏ trống (user không thuộc project nào); chỉ gửi
        clientId thì user vẫn không thuộc project nào.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.NewUserBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.NewUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Đăng ký tài khoản
      tags:
      - auth
  /auth/preauthorize:
    post:
      consumes:
      - application/json
      description: Chỉ admin của project (không phải super admin). Header X-Medplum-On-Behalf-Of
        chỉ ProjectMembership/<id> hoặc tham chiếu profile của thành viên đích (cùng
        project). scope mặc định là openid cộng các scope SMART của người gọi; người
        gọi bị giới hạn SMART chỉ mint được trong phạm vi của mình. Mã chỉ trả MỘT
        lần (kho giữ SHA-256); đổi mã ở /oauth2/token (grant pre-authorized_code).
      parameters:
      - description: ProjectMembership/<id> hoặc profile của đích
        in: header
        name: X-Medplum-On-Behalf-Of
        required: true
        type: string
      - description: Client và tham số
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.PreAuthorizeBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.PreAuthorizeResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Mint pre-authorized code cho một thành viên khác của project
      tags:
      - auth
  /auth/profile:
    post:
      consumes:
      - application/json
      description: Gắn một ProjectMembership đã chọn vào login đang dở (login và profile
        đều bắt buộc có mặt trong body), rồi trả LoginResult như /auth/login (thường
        có code). Membership không tồn tại trả 400 "Profile not found". Có code và
        login thuộc một client thì đặt cookie medplum-<clientId>.
      parameters:
      - description: login (id login đang dở) và profile (id ProjectMembership)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ProfileBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Chọn profile (ProjectMembership) cho login
      tags:
      - auth
  /auth/resetpassword:
    post:
      consumes:
      - application/json
      description: Luôn trả 200 khi email hợp lệ, dù có tài khoản hay không và dù
        gửi thư có được hay không (không lộ tài khoản). Email thuộc tên miền đăng
        nhập ngoài trả 400.
      parameters:
      - description: Email cần đặt lại
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ResetPasswordBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Yêu cầu thư đặt lại mật khẩu
      tags:
      - auth
  /auth/revoke:
    post:
      consumes:
      - application/json
      description: Cần Bearer token. Thu hồi một login (phiên) thuộc về chính người
        gọi theo loginId (UUID, bắt buộc); login của người khác hoặc không có trả
        lỗi 403/404. Thành công trả OperationOutcome "All OK".
      parameters:
      - description: loginId cần thu hồi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.RevokeBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Thu hồi một phiên đăng nhập của chính mình
      tags:
      - auth
  /auth/scope:
    post:
      consumes:
      - application/json
      description: Đổi scope của login đang dở sang scope mới (login và scope đều
        bắt buộc có mặt trong body), rồi trả LoginResult như /auth/login. Scope mới
        chỉ được thu hẹp so với scope hiện có. Có code và login thuộc một client thì
        đặt cookie medplum-<clientId>.
      parameters:
      - description: login và scope mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ScopeBody'
      produces:
