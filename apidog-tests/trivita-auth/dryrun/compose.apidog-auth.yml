# Chồng lên docker-compose.full.yml để chạy bộ test Apidog của module Trivita Auth (chỉ local, KHÔNG dùng cho staging/production).
#   docker compose -p trivita-apidog -f docker-compose.full.yml -f apidog-tests/trivita-auth/dryrun/compose.apidog-auth.yml --env-file .env.full up -d --build --wait
# Seed project + admin + client (in clientId/clientSecret/projectId ra stdout; mật khẩu admin nhập qua biến môi trường, không đưa vào file):
#   AUTH_SEED_ADMIN_PASSWORD="<mật khẩu tạm>" docker compose -p trivita-apidog -f docker-compose.full.yml -f apidog-tests/trivita-auth/dryrun/compose.apidog-auth.yml \
#     exec -T -e AUTH_SEED_ADMIN_PASSWORD auth /app seed project -name "Apidog QA" -admin-email qa.admin@example.org -admin-first QA -admin-last Admin
services:
  auth:
    environment:
      AUTH_ADMIN_ENABLED: "true"
      AUTH_SCIM_ENABLED: "true"
      AUTH_DEFAULT_PROJECT_FEATURES: "scim"
      AUTH_PWNED_ENABLED: "false"      # HIBP gọi Internet, fail đóng; chỉ được tắt ở local/development/test
      AUTH_COOKIE_SECURE: "false"      # base URL là http://localhost
      AUTH_MAIL_PROVIDER: "none"       # không in link bí mật ra log
