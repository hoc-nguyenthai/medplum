          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Export không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Hủy bulk export
      tags:
      - bulk
    get:
      description: Poll sau khi $export. 202 là đang chạy (header X-Progress, Retry-After);
        200 là đã xong kèm manifest các tệp NDJSON; mỗi url trong output tải qua GET
        (cần token).
      parameters:
      - description: Export id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: Đã xong
          schema:
            $ref: '#/definitions/httpapi.ExportManifest'
        "202":
          description: 'Đang chạy; header X-Progress: in-progress và Retry-After (giây)'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Export không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Trạng thái bulk export
      tags:
      - bulk
  /fhir/R4/job/{id}/status:
    get:
      description: 'Trạng thái của job tạo bởi $reindex (và các job nền khác): accepted,
        in-progress, completed hoặc error, kèm kết quả trong Parameters.'
      parameters:
      - description: Job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.Parameters'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Job không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Trạng thái job nền
      tags:
      - operation
  /fhir/R4/metadata:
    get:
      description: 'Mô tả server: các loại resource, interaction, search param và
        operation được hỗ trợ. Công khai, không cần token.'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.CapabilityStatement'
      summary: CapabilityStatement
      tags:
      - fhir
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
      summary: Readiness probe (kiểm tra phụ thuộc)
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Dạng "Bearer <token>". Vai trò: read (GET, _search, operation không
      ghi), write (ghi, batch), admin ($reindex, $expunge). /fhir/R4/metadata công
      khai.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
