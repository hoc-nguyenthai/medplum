apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
spec:
  replicas: 3
  minReadySeconds: 10 # rolling update chậm lại một nhịp: client của pod cũ (đóng 1001) bind lại dần, không dồn một lúc
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # luôn đủ năng lực nhận kết nối trong lúc thay pod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-gateway
    spec:
      automountServiceAccountToken: false # gateway không gọi API Kubernetes
      # 5s drain + 25s shutdown + 5s flush OTEL = 35s; thêm 10s dự phòng. KHÔNG hạ xuống dưới 35s.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # `nonroot` của distroless; số, để kubelet xác minh được runAsNonRoot
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ws-gateway
      containers:
        - name: ws-gateway
          image: trivita-ws-gateway # kustomize `images` thay bằng registry và tag thật
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ws-gateway-config
            - secretRef:
                name: ws-gateway-secrets # FHIR_WS_SIGNING_KEY, REDIS_URL
          env:
            - name: HTTP_ADDR
              value: ":8000"
            # Go dọn bộ nhớ quyết liệt hơn khi gần trần container, tránh bị OOMKill (trần 384Mi, chừa ~20%).
            - name: GOMEMLIMIT
              value: 300MiB
          resources:
            # Đo ở dev (docs/runbook.md): nền ~24 MB; ~100 KB/socket khi đang nhận tin => 1000 socket ~125 MB. Tin lớn hơn thì cao hơn.
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness có kiểm Redis: Redis chết thì pod rút khỏi Service (kết nối sẵn có vẫn mở, chỉ ngừng nhận kết nối mới).
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
