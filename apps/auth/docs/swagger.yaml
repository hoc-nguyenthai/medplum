        - $ref: '#/definitions/fhir.Reference'
        description: AccessPolicy áp cho client; phải thuộc project
      description:
        description: mô tả client (tùy chọn)
        example: Ứng dụng di động cho bệnh nhân
        type: string
      grantType:
        description: các grant client được dùng (ngoài ba giá trị này server còn nhận
          token-exchange và pre-authorized_code); giá trị khác là 400
        example:
        - client_credentials
        items:
          enum:
          - authorization_code
          - client_credentials
          - refresh_token
          type: string
        type: array
      name:
        description: tên client; bắt buộc, rỗng hoặc chỉ khoảng trắng là 400
        example: Ứng dụng bệnh nhân
        type: string
      pkceOptional:
        description: 'true: không bắt buộc PKCE cho client này (mặc định false)'
        example: false
        type: boolean
      redirectUris:
        description: các redirect URI hợp lệ cho luồng authorization_code; mỗi URI
          phải hợp lệ, không thì 400
        example:
        - https://app.example.org/callback
        items:
          type: string
        type: array
      secret:
        description: secret do người gọi đặt (32-256 ký tự); bỏ trống thì server sinh
          64 ký tự hex; chỉ trả trong phản hồi tạo
        example: 0f3c9a1e7b5d4c2a8e6f1b3d5a7c9e0f2b4d6f8a1c3e5b7d9f0a2c4e6b8d0f1a
        maxLength: 256
        minLength: 32
        type: string
    required:
    - name
    type: object
  httpapi.AdminProjectResponse:
    properties:
      project:
        allOf:
        - $ref: '#/definitions/application.AdminProjectView'
