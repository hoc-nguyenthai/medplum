          lệ
        example: an@example.org
        type: string
      password:
        description: mật khẩu mới; bắt buộc, phải qua kiểm tra độ mạnh/rò rỉ (domain.ValidatePassword)
        example: Matkhau-Moi-2026!
        type: string
    required:
    - email
    - password
    type: object
  httpapi.ChangePasswordBody:
    properties:
      newPassword:
        description: Mật khẩu mới; bắt buộc, 8 ký tự trở lên và không quá 72 byte
        example: mat-khau-moi-123
        type: string
      oldPassword:
        description: Mật khẩu hiện tại; bắt buộc, không rỗng
        example: mat-khau-cu-123
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  httpapi.EmailAttachmentBody:
    properties:
      cid:
        description: Content-ID để thân HTML tham chiếu (cid:...) khi inline
        example: logo@example.org
        type: string
      content:
        description: nội dung nhúng, mã hóa theo encoding; dùng content hoặc path
        example: SGVsbG8=
        type: string
      contentDisposition:
        description: 'attachment: tệp đính kèm; inline: nhúng trong thân thư (dùng
          với cid)'
        enum:
        - attachment
        - inline
        example: attachment
        type: string
      contentType:
        description: kiểu MIME của tệp
        example: application/pdf
        type: string
      encoding:
        description: cách mã hóa của content
        enum:
        - utf8
        - base64
        example: base64
        type: string
      filename:
        description: tên tệp hiển thị; phải là chuỗi nếu có
        example: ketqua.pdf
        type: string
      path:
        description: URL https hoặc Binary/<id> (đọc từ FHIR bằng token người gọi);
          đường dẫn khác bị từ chối
        example: https://example.org/file.pdf
        type: string
    type: object
  httpapi.ExchangeBody:
    properties:
      clientId:
        description: Id ClientApplication cấu hình IdP; bắt buộc, không rỗng
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      externalAccessToken:
        description: Access token do IdP ngoài cấp (subject token); bắt buộc, không
          rỗng
        example: ya29.a0AfH6SMB...
        type: string
      membershipId:
        description: Id ProjectMembership đích; bắt buộc với IdP cấu hình ở máy chủ,
          tùy chọn với trường hợp khác
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
    required:
    - clientId
    - externalAccessToken
    type: object
  httpapi.ExternalStartBody:
    properties:
      clientId:
        description: Id ClientApplication có identityProvider riêng; bắt buộc, không
          rỗng
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      codeChallenge:
        description: Mã thách thức PKCE; ghi vào state do auth ký
        example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        type: string
      codeChallengeMethod:
        description: 'Phương thức PKCE: plain hoặc S256'
        enum:
        - plain
        - S256
        example: S256
        type: string
      launch:
        description: Id SMART launch; ghi vào state do auth ký
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      nonce:
        description: Nonce OIDC; ghi vào state do auth ký
        example: c1a9f0e2
        type: string
      projectId:
        description: Id project; ghi vào state do auth ký
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
      redirectUri:
        description: URI chuyển hướng của client; ghi vào state do auth ký
        example: https://app.example.org/callback
        type: string
      returnTo:
        description: Trang của app để quay về sau đăng nhập ngoài; ghi vào state do
          auth ký
        example: https://app.example.org/signin
        type: string
      scope:
        description: Scope OAuth; ghi vào state do auth ký
        example: openid
        type: string
    required:
    - clientId
    type: object
  httpapi.GoogleBody:
    properties:
      clientId:
        description: Id ClientApplication OAuth; có thì project lấy từ client
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
      codeChallenge:
        description: Mã thách thức PKCE
        example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        type: string
      codeChallengeMethod:
        description: 'Phương thức PKCE: plain hoặc S256'
        enum:
        - plain
        - S256
        example: S256
        type: string
      createUser:
        description: true cho phép tạo user mới từ credential nếu chưa có; mặc định
          false
        example: false
        type: boolean
      googleClientId:
        description: Client id Google (aud của credential); bắt buộc có mặt trong
          body
        example: 1234567890-abc.apps.googleusercontent.com
        type: string
      googleCredential:
        description: ID token (JWT RS256) của Google Identity Services; bắt buộc có
          mặt trong body
        example: eyJhbGciOiJSUzI1NiIs...
        type: string
      nonce:
        description: Nonce OIDC
        example: c1a9f0e2
        type: string
      projectId:
        description: Id project đăng nhập
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      redirectUri:
        description: URI chuyển hướng của client; nếu có phải là chuỗi
        example: https://app.example.org/callback
        type: string
      resourceType:
        description: Loại hồ sơ profile cần đăng nhập (ví dụ Practitioner, Patient);
          lưu vào login làm profileType
        example: Practitioner
        type: string
      scope:
        description: Scope OAuth yêu cầu, phân tách bằng khoảng trắng
        example: openid
        type: string
    required:
    - googleClientId
    - googleCredential
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        description: luôn là "ok" khi tiến trình còn sống
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.IntrospectResponse:
    properties:
      active:
        description: true khi token còn dùng được; false thì không có trường nào khác
        example: true
        type: boolean
      client_id:
        description: id ClientApplication đã xin token; chỉ có khi có
        example: b4d1e2f3-0000-4000-8000-000000000000
        type: string
      exp:
        description: thời điểm hết hạn (Unix giây); chỉ có khi active=true
        example: 1763903600
        type: integer
      iat:
        description: thời điểm cấp token (Unix giây); chỉ có khi active=true
        example: 1763900000
        type: integer
      iss:
        description: issuer đã cấp token; chỉ có khi active=true
        example: https://auth.example.org
        type: string
      patient:
        description: Patient của ngữ cảnh SMART launch; chỉ có khi có
        example: Patient/3f2a8c1e-0000-4000-8000-000000000000
        type: string
      scope:
        description: các scope của token, cách nhau bằng khoảng trắng; chỉ có khi
          có
        example: openid fhirUser
        type: string
      sub:
        description: claim sub của token (với refresh token là id của User); chỉ có
          khi active=true
        example: 3f2a8c1e-0000-4000-8000-000000000000
        type: string
    required:
    - active
    type: object
  httpapi.InviteBody:
    properties:
      email:
        description: email của user (hạ chữ thường); phải có email hoặc externalId,
          nếu có thì phải hợp lệ
        example: an@example.org
        type: string
      externalId:
        description: id ngoài; phải có email hoặc externalId, nếu có thì không được
          rỗng/chỉ khoảng trắng
        example: hr-10234
        type: string
      firstName:
        description: tên; bắt buộc, không được chỉ khoảng trắng
        example: An
        type: string
      forceNewMembership:
        description: 'true: luôn tạo membership mới thay vì dùng lại membership hiện
          có'
        example: false
        type: boolean
      lastName:
        description: họ; bắt buộc, không được chỉ khoảng trắng
        example: Nguyễn
        type: string
      membership:
        allOf:
        - $ref: '#/definitions/httpapi.InviteMembershipBody'
        description: tùy chọn của ProjectMembership được tạo
      mfaRequired:
        description: đặt User.mfaRequired cho user mới; bỏ trống là không đặt
        example: false
        type: boolean
      password:
        description: mật khẩu ban đầu; bỏ trống thì user tự đặt qua thư mời; nếu có
          phải qua ValidatePassword
        example: Matkhau-Moi-2026!
        type: string
      patient:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: Patient/<id> mà RelatedPerson liên quan; bắt buộc khi resourceType=RelatedPerson
          và không có membership.profile
      resourceType:
        description: loại hồ sơ tạo cho user; bắt buộc
        enum:
        - Patient
        - Practitioner
        - RelatedPerson
        example: Practitioner
        type: string
      scope:
        description: phạm vi của User; bỏ trống thì server chọn (thường server, hoặc
          project khi project yêu cầu)
        enum:
        - project
        - server
        example: project
        type: string
      sendEmail:
        description: 'false: không gửi thư mời; bỏ trống là gửi khi có email (cần
          cấu hình thư, không thì 400)'
        example: true
        type: boolean
      upsert:
        description: 'true: user đã là member thì cập nhật thay vì 409'
        example: false
        type: boolean
    required:
    - firstName
    - lastName
    - resourceType
    type: object
  httpapi.InviteMembershipBody:
    properties:
      access:
        description: các AccessPolicy tham số hóa gắn thêm cho membership
        items:
          $ref: '#/definitions/fhir.ProjectMembershipAccess'
        type: array
      accessPolicy:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: AccessPolicy áp cho membership; phải thuộc project
      active:
        description: trạng thái hoạt động của membership; bỏ trống là mặc định của
          server
        example: true
        type: boolean
      admin:
        description: 'true: cấp quyền admin project cho membership'
        example: false
        type: boolean
      externalId:
        description: id ngoài của membership (từ hệ thống nhân sự/IdP); nếu có thì
          không được rỗng/chỉ khoảng trắng; trùng là 409
        example: hr-10234
        type: string
      profile:
        allOf:
        - $ref: '#/definitions/fhir.Reference'
        description: hồ sơ có sẵn để gắn vào membership (dùng thay cho việc tạo hồ
          sơ mới)
    type: object
  httpapi.LoginBody:
    properties:
      clientId:
        description: Id ClientApplication OAuth; có thì project được lấy từ client
          và cookie đăng nhập đặt theo client
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
      codeChallenge:
        description: Mã thách thức PKCE gắn vào login để kiểm ở bước đổi code
        example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        type: string
      codeChallengeMethod:
        description: 'Phương thức PKCE của codeChallenge: plain hoặc S256'
        enum:
        - plain
        - S256
        example: S256
        type: string
      email:
        description: Email đăng nhập; bắt buộc, phải là địa chỉ email hợp lệ
        example: an@example.org
        type: string
      launch:
        description: Id ngữ cảnh SMART launch (nếu có)
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      nonce:
        description: Nonce OIDC; bỏ trống thì máy chủ tự sinh
        example: c1a9f0e2
        type: string
      password:
        description: Mật khẩu; bắt buộc, 8 ký tự trở lên và không quá 72 byte
        example: mat-khau-dai-123
        type: string
      projectId:
        description: 'Project đăng nhập: "new" (chưa thuộc project, cho phép không
          có membership) hoặc UUID project; bỏ trống thì suy ra từ clientId (nếu gửi
          cả hai phải khớp project của client)'
        example: new
        type: string
      redirectUri:
        description: URI chuyển hướng của client sau khi đăng nhập; nếu có phải là
          chuỗi
        example: https://app.example.org/callback
        type: string
      remember:
        description: true để kèm refresh token trong kết quả đăng nhập; mặc định false
        example: false
        type: boolean
      resourceType:
        description: Loại hồ sơ profile cần đăng nhập (ví dụ Practitioner, Patient);
          lưu vào login làm profileType
        example: Practitioner
        type: string
      scope:
        description: Scope OAuth yêu cầu, phân tách bằng khoảng trắng; mặc định "openid"
        example: openid
        type: string
    required:
    - email
    - password
    type: object
  httpapi.MFADisableBody:
    properties:
      method:
        description: phương thức cần gỡ; bỏ trống là gỡ tất cả (cần là một yếu tố
          đã đăng ký, không thì 400)
        enum:
        - totp
        - email
        example: totp
        type: string
      token:
        description: mã chứng minh một yếu tố MFA đang có (TOTP hoặc mã email); rỗng
          là 400 "Missing token"
        example: "123456"
        type: string
    required:
    - token
    type: object
  httpapi.MFAEnrollBody:
    properties:
      method:
        description: phương thức cần đăng ký; giá trị khác "email" (hoặc bỏ trống)
          được hiểu là totp
        enum:
        - totp
        - email
        example: totp
        type: string
      token:
        description: 'mã xác nhận: mã email (method=email) hoặc mã TOTP (method=totp);
          rỗng là 400 "Missing token"'
        example: "123456"
        type: string
    required:
    - token
    type: object
  httpapi.MFALoginEnrollBody:
    properties:
      login:
        description: id login đang chờ đăng ký MFA; bắt buộc, rỗng là 400
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      method:
        description: phương thức đăng ký; giá trị khác "email" (hoặc bỏ trống) được
          hiểu là totp
        enum:
        - totp
        - email
        example: totp
        type: string
      token:
        description: mã TOTP của secret trong enrollUri; chỉ dùng với method=totp
          (bắt buộc khi đó), bỏ qua với email
        example: "123456"
        type: string
    required:
    - login
    type: object
  httpapi.MFAResetBody:
    properties:
      method:
        description: yếu tố MFA cần gỡ; bỏ trống hoặc null là totp; khác totp/email
          là 400; user phải đang có yếu tố đó
        enum:
        - totp
        - email
        example: totp
        type: string
    type: object
  httpapi.MFASendEmailBody:
    properties:
      login:
        description: id login đang chờ MFA cần gửi lại mã email; bắt buộc, rỗng là
          400
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
    required:
    - login
    type: object
  httpapi.MFAVerifyBody:
    properties:
      login:
        description: id login đang chờ MFA (lấy từ phản hồi /auth/login); bắt buộc,
          rỗng là 400
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      token:
        description: mã TOTP (6 số) hoặc mã email MFA; bắt buộc, rỗng là 400
        example: "123456"
        type: string
    required:
    - login
    - token
    type: object
  httpapi.MethodBody:
    properties:
      clientId:
        description: Id ClientApplication; chỉ ghi vào state ký khi đăng nhập ngoài
          đã bật
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
      codeChallenge:
        description: Mã thách thức PKCE; chỉ ghi vào state ký khi đăng nhập ngoài
          đã bật
        example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        type: string
      codeChallengeMethod:
        description: 'Phương thức PKCE: plain hoặc S256; chỉ ghi vào state ký khi
          đăng nhập ngoài đã bật'
        enum:
        - plain
        - S256
        example: S256
        type: string
      email:
        description: Email cần xác định cách đăng nhập; bắt buộc, phải hợp lệ
        example: an@example.org
        type: string
      launch:
        description: Id SMART launch; chỉ ghi vào state ký khi đăng nhập ngoài đã
          bật
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      nonce:
        description: Nonce OIDC; chỉ ghi vào state ký khi đăng nhập ngoài đã bật
        example: c1a9f0e2
        type: string
      projectId:
        description: Id project; chỉ ghi vào state ký khi đăng nhập ngoài đã bật
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      redirectUri:
        description: URI chuyển hướng của client; chỉ ghi vào state ký khi đăng nhập
          ngoài đã bật
        example: https://app.example.org/callback
        type: string
      returnTo:
        description: Trang của app để quay về sau đăng nhập ngoài; chỉ ghi vào state
          ký khi đăng nhập ngoài đã bật
        example: https://app.example.org/signin
        type: string
      scope:
        description: Scope OAuth; chỉ ghi vào state ký khi đăng nhập ngoài đã bật
        example: openid
        type: string
    required:
    - email
    type: object
  httpapi.NewPatientBody:
    properties:
      login:
        description: Id login từ /auth/newuser; bắt buộc, không rỗng
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      projectId:
        description: Id project cho phép bệnh nhân tự đăng ký; bắt buộc, không rỗng
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
    required:
    - login
    - projectId
    type: object
  httpapi.NewProjectBody:
    properties:
      login:
        description: Id login từ /auth/newuser; bắt buộc, phải là UUID
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      projectName:
        description: Tên project; bắt buộc, 4 đến 72 ký tự
        example: Bệnh viện A
        type: string
    required:
    - login
    - projectName
    type: object
  httpapi.NewUserBody:
    properties:
      clientId:
        description: Id ClientApplication; chỉ gửi clientId thì user vẫn không thuộc
          project nào
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
      codeChallenge:
        description: Mã thách thức PKCE ghi vào login vừa tạo
        example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        type: string
      codeChallengeMethod:
        description: 'Phương thức PKCE: plain hoặc S256'
        enum:
        - plain
        - S256
        example: S256
        type: string
      email:
        description: Email; bắt buộc, hợp lệ, dài 3 đến 72 ký tự
        example: an@example.org
        type: string
      firstName:
        description: Tên; bắt buộc, 1 đến 128 ký tự
        example: An
        type: string
      lastName:
        description: Họ; bắt buộc, 1 đến 128 ký tự
        example: Nguyen
        type: string
      nonce:
        description: Nonce OIDC ghi vào login vừa tạo
        example: c1a9f0e2
        type: string
      password:
        description: Mật khẩu; bắt buộc, 8 ký tự trở lên và không quá 72 byte
        example: mat-khau-dai-123
        type: string
      projectId:
        description: '"new" (sẽ tạo project mới), id project cho đăng ký mở, hoặc
          bỏ trống (user không thuộc project nào)'
        example: new
        type: string
      recaptchaSiteKey:
        description: Site key reCAPTCHA tương ứng với token; chỉ cần khi bật reCAPTCHA
        example: 6LdExampleSiteKey
        type: string
      recaptchaToken:
        description: Token reCAPTCHA; chỉ cần khi máy chủ hoặc project bật reCAPTCHA
        example: 03AGdBq25...
        type: string
      redirectUri:
        description: URI chuyển hướng của client ghi vào login vừa tạo
        example: https://app.example.org/callback
        type: string
      remember:
        description: true để kèm refresh token cho login vừa tạo; mặc định false
        example: false
        type: boolean
      scope:
        description: Scope OAuth ghi vào login vừa tạo
        example: openid
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  httpapi.NewUserResponse:
    properties:
      emailVerificationRequired:
        description: true khi máy chủ yêu cầu email đã xác minh để tạo project (cấu
          hình RequireVerifiedEmailForProject) và projectId của yêu cầu là "new";
          ngược lại false
        example: false
        type: boolean
      login:
        description: Id login vừa tạo (chưa có membership), dùng cho /auth/newproject
          hoặc /auth/newpatient
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
    required:
    - emailVerificationRequired
    - login
    type: object
  httpapi.PreAuthorizeBody:
    properties:
      clientId:
        description: Id ClientApplication sẽ đổi mã; bắt buộc, phải là UUID
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      expiresIn:
        description: Thời hạn mã, tính bằng giây (số nguyên 1 đến 604800); bỏ trống
          thì dùng mặc định của máy chủ
        example: 3600
        maximum: 604800
        minimum: 1
        type: integer
      nonce:
        description: Nonce OIDC gắn vào mã; nếu có phải là chuỗi
        example: c1a9f0e2
        type: string
      scope:
        description: Scope của mã; mặc định openid cộng các scope SMART của người
          gọi
        example: openid
        type: string
    required:
    - clientId
    type: object
  httpapi.ProfileBody:
    properties:
      login:
        description: Id login đang dở (từ LoginResult.login); bắt buộc có mặt trong
          body
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      profile:
        description: Id ProjectMembership chọn làm profile; bắt buộc có mặt trong
          body (phải thuộc các membership của login)
        example: a3b1c2d4-0000-4000-8000-000000000001
        type: string
    required:
    - login
    - profile
    type: object
  httpapi.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: boolean
        description: kết quả từng phụ thuộc theo tên (true = sẵn sàng); rỗng khi chưa
          khai báo phụ thuộc nào
        type: object
      ready:
        description: true khi mọi phụ thuộc sẵn sàng (HTTP 200); false kèm HTTP 503
        example: true
        type: boolean
    required:
    - checks
    - ready
    type: object
  httpapi.RegisterBody:
    properties:
      redirect_uris:
        description: danh sách redirect URI; phần tử đầu phải khớp chính xác một client
          dựng sẵn (không thì 400 invalid_client_metadata)
        example:
        - https://app.example.org/callback
        items:
          type: string
        type: array
    required:
    - redirect_uris
    type: object
  httpapi.ResetPasswordBody:
    properties:
      email:
        description: Email cần đặt lại mật khẩu; bắt buộc, phải hợp lệ
        example: an@example.org
        type: string
      projectId:
        description: Id project của user (UUID); bỏ trống nếu user không thuộc project
          nào
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      recaptchaSiteKey:
        description: Site key reCAPTCHA tương ứng; chỉ cần khi bật reCAPTCHA
        example: 6LdExampleSiteKey
        type: string
      recaptchaToken:
        description: Token reCAPTCHA; chỉ cần khi máy chủ hoặc project bật reCAPTCHA
        example: 03AGdBq25...
        type: string
      redirectUri:
        description: URI app đính vào link trong thư đặt lại mật khẩu
        example: https://app.example.org/setpassword
        type: string
      sendEmail:
        description: false để không gửi thư (chỉ tạo yêu cầu); mặc định true
        example: true
        type: boolean
    required:
    - email
    type: object
  httpapi.RevokeBody:
    properties:
      loginId:
        description: Id login (phiên) của chính người gọi cần thu hồi; bắt buộc, phải
          là UUID
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
    required:
    - loginId
    type: object
  httpapi.RotateSecretBody:
    properties:
      retireOnly:
        description: 'true: chỉ bỏ secret cũ đang chờ hết hạn (retiringSecret), không
          đổi secret hiện tại; loại trừ với secret'
        example: false
        type: boolean
      secret:
        description: secret mới do người gọi đặt (32-256 ký tự); bỏ trống thì server
          sinh 64 ký tự hex; phải khác secret hiện tại
        example: 7d1e5b9a3c6f2e4a8b0d9c1f3e5a7b2d4c6e8f0a1b3d5f7e9c2a4b6d8e0f1a3c
        maxLength: 256
        minLength: 32
        type: string
    type: object
  httpapi.RotateSecretResponse:
    properties:
      clientId:
        description: id client
        type: string
      clientSecret:
        description: secret MỚI, chỉ hiện trong phản hồi này; không có khi retireOnly
        type: string
      retiring:
        description: 'true: secret cũ vẫn dùng được song song (retiringSecret) cho
          tới lần xoay kế tiếp hoặc retireOnly'
        type: boolean
    required:
    - clientId
    - retiring
    type: object
  httpapi.ScopeBody:
    properties:
      login:
        description: Id login đang dở; bắt buộc có mặt trong body
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      scope:
        description: Scope mới, phân tách bằng khoảng trắng; bắt buộc có mặt trong
          body và chỉ được thu hẹp
        example: openid profile
        type: string
    required:
    - login
    - scope
    type: object
  httpapi.SendEmailBody:
    properties:
      attachments:
        description: các tệp đính kèm (tùy chọn)
        items:
          $ref: '#/definitions/httpapi.EmailAttachmentBody'
        type: array
      bcc:
        description: người nhận ẩn (tùy chọn)
        example: bcc@example.org
        type: string
      cc:
        description: người nhận bản sao (tùy chọn)
        example: cc@example.org
        type: string
      from:
        description: người gửi, đúng một địa chỉ; chỉ dùng nếu thuộc danh sách được
          duyệt, không thì dùng địa chỉ mặc định
        example: Trivita <no-reply@example.org>
        type: string
      html:
        description: thân thư dạng HTML (tùy chọn)
        example: <p>Xin chào</p>
        type: string
      icalEvent:
        description: 'sự kiện iCal: chuỗi nội dung hoặc đối tượng {content, method,
          filename}'
        example: BEGIN:VCALENDAR...
        type: string
      replyTo:
        description: địa chỉ nhận trả lời (tùy chọn)
        example: hotro@example.org
        type: string
      subject:
        description: tiêu đề thư; bắt buộc, không rỗng, không chứa xuống dòng
        example: Kết quả xét nghiệm
        type: string
      text:
        description: thân thư dạng văn bản thuần (tùy chọn)
        example: Xin chào, kết quả đã sẵn sàng.
        type: string
      to:
        description: người nhận; bắt buộc, không rỗng
        example: an@example.org
        type: string
    required:
    - subject
    - to
    type: object
  httpapi.SetPasswordBody:
    properties:
      id:
        description: Id yêu cầu (PasswordChangeRequest) lấy từ link trong thư; bắt
          buộc, phải là UUID
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      password:
        description: Mật khẩu mới; bắt buộc, 8 ký tự trở lên và không quá 72 byte
        example: mat-khau-moi-123
        type: string
      secret:
        description: Secret trong link thư; bắt buộc, không rỗng, dùng một lần
        example: s3cr3t-from-email-link
        type: string
    required:
    - id
    - password
    - secret
    type: object
  httpapi.SuperProjectBody:
    properties:
      features:
        description: tính năng bật sẵn cho project (tên chữ thường, số, gạch ngang;
          tối đa 20)
        example:
        - scim
        items:
          type: string
        type: array
      name:
        description: tên project, 1 đến 72 ký tự; bắt buộc
        example: Bệnh viện B
        type: string
      ownerEmail:
        description: email của user TOÀN CỤC đã tồn tại sẽ là admin đầu tiên; bỏ trống
          là chính người gọi
        example: owner@example.org
        type: string
    required:
    - name
    type: object
  httpapi.SuperProjectResponse:
    properties:
      clientId:
        description: id client mặc định của project
        type: string
      clientSecret:
        description: secret của client mặc định; CHỈ hiện trong phản hồi này
        type: string
      membershipId:
        description: id ProjectMembership admin của chủ sở hữu trong project mới
        type: string
      name:
        description: tên project
        example: Bệnh viện B
        type: string
      owner:
        description: tham chiếu user chủ sở hữu
        example: User/0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a45
        type: string
      projectId:
        description: id project mới
        example: 0192f3a4-7b1c-7d2e-9a10-3c5e8f1b2a44
        type: string
    required:
    - clientId
    - clientSecret
    - membershipId
    - name
    - owner
    - projectId
    type: object
  httpapi.TokenErrorBody:
    properties:
      error:
        description: mã lỗi OAuth (invalid_request, invalid_client, invalid_grant,
          unsupported_grant_type...)
        example: invalid_request
        type: string
      error_description:
        description: mô tả lỗi cho người lập trình; có thể vắng
        example: Missing grant_type
        type: string
    required:
    - error
    type: object
  httpapi.UpdateEmailBody:
    properties:
      email:
        description: email đăng nhập mới; hạ chữ thường, phải đúng định dạng, khác
          email hiện tại, không trùng trong project
        example: an.nguyen@benhvien-a.vn
        type: string
    required:
    - email
    type: object
  httpapi.VerifyEmailBody:
    properties:
      id:
        description: Id yêu cầu xác minh lấy từ link trong thư; bắt buộc, phải là
          UUID
        example: a3b1c2d4-0000-4000-8000-000000000000
        type: string
      secret:
        description: Secret trong link thư; bắt buộc, không rỗng
        example: s3cr3t-from-email-link
        type: string
    required:
    - id
    - secret
    type: object
  scim.Email:
    properties:
      value:
        description: địa chỉ email; khi tạo/PATCH, phần tử đầu phải có value không
          rỗng
        example: an@example.org
        type: string
    required:
    - value
    type: object
  scim.Error:
    properties:
      detail:
        description: mô tả lỗi cho người đọc; có thể vắng
        example: userName is required
        type: string
      schemas:
        description: luôn chứa urn:ietf:params:scim:api:messages:2.0:Error
        example:
        - urn:ietf:params:scim:api:messages:2.0:Error
        items:
          type: string
        type: array
      scimType:
        description: loại lỗi SCIM (invalidFilter, invalidSyntax, invalidPath, invalidValue,
          mutability, noTarget, tooMany, uniqueness...); có thể vắng
        example: invalidValue
        type: string
      status:
        description: mã HTTP dạng chuỗi
        example: "400"
        type: string
    required:
    - schemas
    - status
    type: object
  scim.ListResponse:
    properties:
      Resources:
        description: các User của trang này (mảng rỗng khi không có)
        items:
          $ref: '#/definitions/scim.User'
        type: array
      itemsPerPage:
        description: số bản ghi trong trang này
        example: 20
        type: integer
      schemas:
        description: luôn chứa urn:ietf:params:scim:api:messages:2.0:ListResponse
        example:
        - urn:ietf:params:scim:api:messages:2.0:ListResponse
        items:
          type: string
        type: array
      startIndex:
        description: chỉ số bắt đầu của trang (tính từ 1)
        example: 1
        type: integer
      totalResults:
        description: tổng số bản ghi khớp filter (không phụ thuộc phân trang)
        example: 42
        type: integer
    required:
    - Resources
    - itemsPerPage
    - schemas
    - startIndex
    - totalResults
    type: object
  scim.Meta:
    properties:
      lastModified:
        description: thời điểm sửa gần nhất (RFC 3339); chỉ đọc
        example: "2026-11-23T08:30:00Z"
        format: date-time
        type: string
      location:
        description: URL của tài nguyên; chỉ đọc
        example: https://auth.example.org/scim/v2/Users/3f2a8c1e-0000-4000-8000-000000000000
        type: string
      resourceType:
        description: loại tài nguyên SCIM, luôn là "User"
        example: User
        type: string
      version:
        description: 'phiên bản của tài nguyên: hiện bằng thời điểm cập nhật của membership
          (cùng giá trị lastModified), không phải ETag; chỉ đọc'
        example: "2026-11-23T08:30:00Z"
        type: string
    required:
    - resourceType
    type: object
  scim.Name:
    properties:
      familyName:
        description: họ (ghi vào lastName của User)
        example: Nguyễn
        type: string
      givenName:
        description: tên (ghi vào firstName của User)
        example: An
        type: string
    type: object
  scim.PatchOp:
    properties:
      Operations:
        description: danh sách thao tác, áp theo thứ tự; vượt giới hạn số thao tác
          là 400 tooMany
        items:
          $ref: '#/definitions/scim.PatchOperation'
        type: array
      schemas:
        description: phần tử đầu phải là urn:ietf:params:scim:api:messages:2.0:PatchOp,
          không thì 400
        example:
        - urn:ietf:params:scim:api:messages:2.0:PatchOp
        items:
          type: string
        type: array
    required:
    - Operations
    - schemas
    type: object
  scim.PatchOperation:
    properties:
      op:
        description: loại thao tác (không phân biệt hoa thường)
        enum:
        - add
        - remove
        - replace
        example: replace
        type: string
      path:
        description: 'thuộc tính đích: active, externalId, name, name.givenName, name.familyName,
          emails; bỏ trống thì value là đối tượng nhiều thuộc tính (không dùng với
          remove)'
        example: active
        type: string
      value:
        description: 'giá trị mới (kiểu theo thuộc tính: boolean, chuỗi, đối tượng
          hoặc mảng); không cần với remove'
        type: object
    required:
    - op
    type: object
  scim.User:
    properties:
      active:
        description: trạng thái hoạt động của membership; ghi được
        example: true
        type: boolean
      emails:
        description: danh sách email; bắt buộc khi tạo, chỉ phần tử đầu được dùng
        items:
          $ref: '#/definitions/scim.Email'
        type: array
      externalId:
        description: id do IdP quản lý; ghi được (POST/PUT/PATCH); chuỗi rỗng là xóa
        example: hr-10234
        type: string
      id:
        description: id ProjectMembership do server cấp; chỉ đọc (bị bỏ qua khi tạo/PUT)
        example: 3f2a8c1e-0000-4000-8000-000000000000
        type: string
      meta:
        allOf:
        - $ref: '#/definitions/scim.Meta'
        description: siêu dữ liệu do server sinh; chỉ đọc
      name:
        allOf:
        - $ref: '#/definitions/scim.Name'
        description: họ tên (chỉ givenName, familyName được dùng)
      schemas:
        description: danh sách schema URN; chứa urn:ietf:params:scim:schemas:core:2.0:User
        example:
        - urn:ietf:params:scim:schemas:core:2.0:User
        items:
          type: string
        type: array
      userName:
        description: tên đăng nhập SCIM; bắt buộc khi tạo, không đổi được sau khi
          tạo (PUT/PATCH bỏ qua)
        example: an.nguyen@example.org
        type: string
      userType:
        description: loại hồ sơ; chỉ có tác dụng khi tạo, thiếu hoặc giá trị khác
          là Practitioner; không đổi được sau đó
        enum:
        - Patient
        - Practitioner
        - RelatedPerson
        example: Practitioner
        type: string
    required:
    - emails
    - schemas
    - userName
    type: object
info:
  contact: {}
  description: Dịch vụ xác thực và cấp token (port từ Medplum). Lỗi dưới /auth và
    /admin trả OperationOutcome (application/fhir+json); lỗi /oauth2 theo RFC 6749.
  title: Trivita Auth API
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      description: 'Chỉ khóa công khai; có `ETag` và `Cache-Control: public, max-age=300`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: JWKS (khóa công khai để xác minh token)
      tags:
      - well-known
  /.well-known/oauth-authorization-server:
    get:
      description: Cùng một tài liệu ở hai đường dẫn. Chỉ khai những gì đã cài.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Discovery OIDC / OAuth 2.0 authorization server
      tags:
      - well-known
  /.well-known/oauth-protected-resource:
    get:
      description: '`resource` tùy chọn phải bắt đầu bằng địa chỉ của auth; mặc định
        là chính auth.'
      parameters:
      - description: phải bắt đầu bằng địa chỉ của auth
        in: query
        name: resource
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Protected resource metadata (RFC 9728)
      tags:
      - well-known
  /.well-known/openid-configuration:
    get:
      description: Cùng một tài liệu ở hai đường dẫn. Chỉ khai những gì đã cài.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Discovery OIDC / OAuth 2.0 authorization server
      tags:
      - well-known
  /.well-known/smart-configuration:
    get:
      description: SMART on FHIR discovery, khai cùng endpoint với openid-configuration.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: SMART configuration
      tags:
      - well-known
  /.well-known/smart-styles.json:
    get:
      description: Giá trị cố định.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: SMART style (màu, font cho ứng dụng nhúng)
      tags:
      - well-known
  /admin/projects/{projectId}:
    get:
      description: Chỉ admin của project; projectId khác project của người gọi là
        403. Giá trị `secret` và khóa bí mật trong `site` bị che.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AdminProjectResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đọc project của chính mình (admin)
      tags:
      - admin
  /admin/projects/{projectId}/client:
    post:
      consumes:
      - application/json
      description: Tạo client và membership của nó. `secret` (tối thiểu 32 ký tự)
        do người gọi đặt hoặc server sinh (64 ký tự hex); chỉ được trả trong phản
        hồi này. Trường ngoài danh sách (identityProvider, signInForm, status, meta...)
        là 400. accessPolicy phải thuộc project.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: Client
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.AdminClientBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fhir.ClientApplication'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Tạo ClientApplication trong project
      tags:
      - admin
  /admin/projects/{projectId}/client/{clientId}/rotate-secret:
    post:
      consumes:
      - application/json
      description: Secret hiện tại thành `retiringSecret` (vẫn dùng được để các nơi
        triển khai kịp đổi), secret mới (do người gọi đặt hoặc server sinh) là `secret`;
        `retiringSecret` cũ hơn bị bỏ. `retireOnly=true` chỉ bỏ `retiringSecret` (idempotent).
        Body tùy chọn; trường lạ là 400. Client ngoài project, không tồn tại hoặc
        dựng sẵn đều là 403 chung. Client không có secret là 400. Không thu hồi token
        đã cấp. `clientSecret` chỉ hiện một lần.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id client
        in: path
        name: clientId
        required: true
        type: string
      - description: Tùy chọn xoay
        in: body
        name: body
        schema:
          $ref: '#/definitions/httpapi.RotateSecretBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.RotateSecretResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Xoay secret của client (ClientApplication/$rotate-secret)
      tags:
      - admin
  /admin/projects/{projectId}/invite:
    post:
      consumes:
      - application/json
      description: Tạo (hoặc dùng lại) User, hồ sơ Patient/Practitioner/RelatedPerson
        và ProjectMembership trong một transaction, rồi gửi thư (trừ sendEmail=false).
        Cần email hoặc externalId. Practitioner bị chặn theo AUTH_BLOCKED_EMAIL_DOMAINS
        và setting allowedPractitionerEmailDomain. 409 nếu user đã là member (trừ
        upsert) hoặc externalId trùng. Gửi thư lỗi là 400 nhưng dữ liệu đã tạo (thông
        báo nêu rõ membership). Trả ProjectMembership.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: Lời mời
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.InviteBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.ProjectMembership'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Mời user vào project
      tags:
      - admin
  /admin/projects/{projectId}/members/{membershipId}:
    delete:
      description: Không xóa chủ project hay admin cuối cùng (400). User thuộc project
        mà hết membership thì bị xóa cùng; user dùng chung nhiều project thì giữ.
        Token của membership bị từ chối ngay.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id membership
        in: path
        name: membershipId
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Xóa membership
      tags:
      - admin
    get:
      description: Membership không thuộc project hoặc không tồn tại đều là 403.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id membership
        in: path
        name: membershipId
        required: true
        type: string
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.ProjectMembership'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đọc một membership của project
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Body là toàn bộ ProjectMembership (resourceType và id khớp đường
        dẫn, nếu không 403). Chỉ admin, active, externalId, accessPolicy, access được
        đổi; đổi user, profile hoặc project là 400. accessPolicy phải thuộc project.
        Không hạ quyền hay vô hiệu hóa admin cuối cùng (400).
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id membership
        in: path
        name: membershipId
        required: true
        type: string
      - description: Membership
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/fhir.ProjectMembership'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.ProjectMembership'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Sửa membership
      tags:
      - admin
  /admin/projects/{projectId}/members/{membershipId}/mfa/reset:
    post:
      consumes:
      - application/json
      description: 'Body tùy chọn {method: totp|email} (mặc định totp). User phải
        đang có yếu tố đó (400). Gỡ totp thì secret bị thay. Chỉ user thuộc project.'
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id membership
        in: path
        name: membershipId
        required: true
        type: string
      - description: Phương thức MFA cần gỡ (tùy chọn)
        in: body
        name: body
        schema:
          $ref: '#/definitions/httpapi.MFAResetBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Gỡ một yếu tố MFA của member
      tags:
      - admin
  /admin/projects/{projectId}/members/{membershipId}/resetpassword:
    post:
      description: 'Chỉ user thuộc project (user phạm vi server là 403). Khác /auth/resetpassword
        công khai, lỗi được báo rõ: thiếu email 400, chưa cấu hình thư 400, gửi thư
        lỗi 500.'
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id membership
        in: path
        name: membershipId
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Gửi thư đặt lại mật khẩu cho một member
      tags:
      - admin
  /admin/projects/{projectId}/members/{membershipId}/update-email:
    post:
      consumes:
      - application/json
      description: Chỉ user thuộc đúng project của người gọi (user ở phạm vi server
        hay project khác là 403 chung). Email mới không trùng trong project (400);
        Practitioner chịu danh sách chặn và allowedPractitionerEmailDomain. Ghi email,
        đặt emailVerified=false, vô hiệu mọi security request và thu hồi mọi login
        trong một transaction; thư báo gửi tới địa chỉ cũ nếu đã cấu hình thư. Không
        đổi telecom của hồ sơ.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: id membership
        in: path
        name: membershipId
        required: true
        type: string
      - description: Email mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateEmailBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đổi email đăng nhập của member (User/$update-email)
      tags:
      - admin
  /admin/projects/{projectId}/secrets:
    post:
      consumes:
      - application/json
      description: Body là mảng ProjectSetting; thay TOÀN BỘ Project.secret (`[]`
        xóa hết). Mỗi mục có tên (chữ cái đầu, chữ, số, `_.-`, tối đa 64), không trùng,
        đúng một value[x] (string tối đa 4096). Phản hồi che giá trị (`********`);
        gửi lại đúng giá trị che nghĩa là giữ giá trị hiện có của secret cùng tên.
        Secret `smtp*` chỉ nhận khi máy chủ bật SMTP riêng của project.
      parameters:
      - description: id project
        in: path
        name: projectId
        required: true
        type: string
      - description: Danh sách secret
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/fhir.ProjectSetting'
          type: array
      produces:
      - application/json
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AdminProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
