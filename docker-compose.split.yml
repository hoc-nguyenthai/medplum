# Tách fhir-server thành các service nền (docs/plans/fhir-server-split-candidates.md, S2, S3, S5): fhir-server chỉ còn là API (nhận yêu cầu, phát sự kiện, tạo job),
#   fhir-downloader  tự tải attachment URL ngoài về kho Binary (:8009, chỉ probe)
#   fhir-notifier    giao rest-hook bền và khớp websocket (:8010, chỉ probe)
#   fhir-worker      chạy job nền: bulk export, $reindex cả loại, batch async (:8011, chỉ probe)
#
#   FHIR_WRITE_TOKENS=ops:$(openssl rand -hex 16) FHIR_ADMIN_TOKENS=root:$(openssl rand -hex 16) \
#   docker compose -f docker-compose.yml -f docker-compose.split.yml up --build
#
# Với JWT của auth (docker-compose.auth.yml) chồng thêm docker-compose.split-auth.yml để fhir-worker mở được chữ ký quyền của job:
#   FHIR_JOB_SIGNING_KEY=$(openssl rand -hex 24) docker compose -f docker-compose.yml -f docker-compose.auth.yml -f docker-compose.split.yml -f docker-compose.split-auth.yml up --build
#
# Điểm cần đúng:
#  - Redis là bắt buộc (broker sự kiện): fhir-server phát lên Redis, fhir-downloader và fhir-notifier nghe bằng consumer group RIÊNG (khác "trivita" của fhir-server).
#  - Kho Binary dùng chung: cùng volume split-blobs gắn vào /data của fhir-server, fhir-downloader và fhir-worker (production dùng s3:<bucket> cho cả ba).
#  - Chỉ fhir-server migrate (DATABASE_AUTO_MIGRATE=true, một replica); ba service kia chỉ chạy sau khi fhir-server healthy và từ chối khởi động nếu schema chưa migrate.
#  - FHIR_BASE_URL phải GIỐNG HỆT giữa fhir-server, fhir-downloader (không tải URL của chính hệ thống) và fhir-worker (URL file kết quả export).
#  - Các tuỳ chọn router (FHIR_SKIP_VALIDATION, FHIR_SKIP_CONSTRAINTS, FHIR_UPDATE_AS_CREATE, FHIR_BASE64_BINARY_MAX_BYTES) của fhir-worker phải trùng fhir-server: đặt trong
#    apps/fhir-server/.env và apps/fhir-worker/.env cùng giá trị.
#  - KHÔNG mô phỏng ở đây: chính sách mạng chặn đường ra Internet của fhir-server (lý do chính của việc tách fhir-downloader và fhir-notifier). Compose không có network policy
#    theo từng service; áp dụng ở hạ tầng triển khai thật (security group, network policy): chỉ fhir-downloader (tải) và fhir-notifier (webhook) được ra ngoài.
#  - Dev: máy chủ ngoài/webhook ở địa chỉ nội bộ bị chặn (chống SSRF); chỉ dev mới đặt FHIR_AUTO_DOWNLOAD_ALLOW_PRIVATE=true (fhir-downloader) và FHIR_WEBHOOK_ALLOW_PRIVATE=true
#    (fhir-notifier) trong apps/<service>/.env.
services:
  fhir-server:
    environment:
      # chỉ PHÁT sự kiện, không giao, không tải, không chạy job
      BROKER_DRIVER: redis
      REDIS_URL: redis://redis:6379/0
      FHIR_SUBSCRIPTIONS: "true"
      FHIR_SUBSCRIPTION_DELIVERY: "false"
      FHIR_AUTO_DOWNLOAD: "true"
      FHIR_AUTO_DOWNLOAD_WORKER: "false"
      FHIR_JOB_EXECUTION: "false"
      FHIR_BINARY_STORAGE: file:/data/blobs
      FHIR_WRITE_TOKENS: ${FHIR_WRITE_TOKENS:-}
      FHIR_ADMIN_TOKENS: ${FHIR_ADMIN_TOKENS:-}
    volumes:
      - split-blobs:/data
    depends_on:
      redis:
        condition: service_healthy

  fhir-downloader:
    build:
      context: .
      dockerfile: apps/fhir-downloader/Dockerfile
    image: trivita-fhir-downloader:local
    restart: unless-stopped
    ports:
      - "${FHIR_DOWNLOADER_PORT:-8009}:8000"
    env_file:
      - path: apps/fhir-downloader/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://fhir_app:${FHIR_DB_PASSWORD:-fhir}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
      DATABASE_REQUIRE_SCHEMA: "true"
      REDIS_URL: redis://redis:6379/0
      FHIR_BASE_URL: http://localhost:${FHIR_SERVER_PORT:-8005}/fhir/R4
      FHIR_BINARY_STORAGE: file:/data/blobs
      LOG_JSON: "true"
    volumes:
      - split-blobs:/data
    depends_on:
      fhir-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  fhir-notifier:
    build:
      context: .
      dockerfile: apps/fhir-notifier/Dockerfile
    image: trivita-fhir-notifier:local
    restart: unless-stopped
    ports:
      - "${FHIR_NOTIFIER_PORT:-8010}:8000"
    env_file:
      - path: apps/fhir-notifier/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://fhir_app:${FHIR_DB_PASSWORD:-fhir}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
      DATABASE_REQUIRE_SCHEMA: "true"
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    depends_on:
      fhir-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  fhir-worker:
    build:
      context: .
      dockerfile: apps/fhir-worker/Dockerfile
    image: trivita-fhir-worker:local
    restart: unless-stopped
    ports:
      - "${FHIR_WORKER_PORT:-8011}:8000"
    env_file:
      - path: apps/fhir-worker/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://fhir_app:${FHIR_DB_PASSWORD:-fhir}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
      DATABASE_REQUIRE_SCHEMA: "true"
      FHIR_BASE_URL: http://localhost:${FHIR_SERVER_PORT:-8005}/fhir/R4
      FHIR_BINARY_STORAGE: file:/data/blobs
      # fhir-server phát sự kiện (Subscription và tự tải bật) nên batch async do fhir-worker ghi cũng phải phát
      FHIR_SUBSCRIPTIONS: "true"
      FHIR_AUTO_DOWNLOAD: "true"
      BROKER_DRIVER: redis
      REDIS_URL: redis://redis:6379/0
      FHIR_JOB_MAINTENANCE_INTERVAL: 2s
      LOG_JSON: "true"
    volumes:
      - split-blobs:/data
    depends_on:
      fhir-server:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  split-blobs: # kho nội dung Binary dùng chung fhir-server, fhir-downloader và fhir-worker
