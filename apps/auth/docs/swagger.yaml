      description: 'Dùng khi MFA bắt buộc mà user chưa đăng ký (phản hồi login có
        mfaEnrollRequired). method=email: đăng ký và gửi mã tới email (nhập mã qua
        /auth/mfa/verify). method=totp (mặc định): gửi token của secret trong enrollUri.
        Cùng hạn mức thử với /auth/mfa/verify.'
      parameters:
      - description: login, phương thức và token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.MFALoginEnrollBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
