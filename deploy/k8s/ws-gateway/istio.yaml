# VÍ DỤ Istio (cụm có istio-ingressgateway). Chỉ để lộ đường dẫn websocket, KHÔNG để lộ /health/*.
# Envoy hỗ trợ WebSocket upgrade mặc định. KHÔNG đặt `timeout` cho route (mặc định không giới hạn; Istio còn từ chối `0s`) và chú ý
# idleTimeout của kết nối upstream (mặc định 1h; heartbeat 30s của gateway giữ kết nối không idle).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ws-gateway
spec:
  hosts: [ws.example.org] # ĐỔI
  gateways: [istio-ingress/public-gateway] # ĐỔI: tên Gateway của cụm (phải có server https cho host trên)
  http:
    - match:
        - uri: { exact: /ws/subscriptions-r4 }
      route:
        - destination:
            host: ws-gateway
            port: { number: 80 }
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ws-gateway
spec:
  host: ws-gateway
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST # kết nối dài: dồn vào pod ít kết nối nhất khi bind lại sau rollout
    connectionPool:
      http:
        idleTimeout: 2h
