        type: string
      - description: vào id token
        in: query
        name: nonce
        type: string
      - description: PKCE
        in: query
        name: code_challenge
        type: string
      - description: S256
        in: query
        name: code_challenge_method
        type: string
      - description: cùng scheme và host với auth hoặc fhir-server
