# Websocket của Subscription tách riêng: fhir-server chỉ CẤP TOKEN và khớp sự kiện (FHIR_WS_MODE=issuer), ws-gateway giữ kết nối.
#   FHIR_WS_SIGNING_KEY=$(openssl rand -hex 24) FHIR_WRITE_TOKENS=ops:$(openssl rand -hex 16) \
#   docker compose -f docker-compose.yml -f docker-compose.ws.yml up --build fhir-server ws-gateway redis postgres
# Khóa FHIR_WS_SIGNING_KEY dùng chung hai bên (>= 32 ký tự); ở đây lấy từ biến môi trường của lệnh compose (nội suy), không đọc từ .env của app.
# FHIR_WS_URL là địa chỉ websocket CÔNG KHAI của gateway (client nhìn thấy), khác địa chỉ nội bộ giữa các container.
services:
  fhir-server:
    environment:
      FHIR_SUBSCRIPTIONS: "true"
      FHIR_WS_MODE: issuer
      BROKER_DRIVER: redis
      REDIS_URL: redis://redis:6379/0
      FHIR_WS_SIGNING_KEY: ${FHIR_WS_SIGNING_KEY:?đặt FHIR_WS_SIGNING_KEY (>= 32 ký tự, giống ws-gateway)}
      FHIR_WS_URL: ws://localhost:${WS_GATEWAY_PORT:-8007}/ws/subscriptions-r4
      FHIR_WRITE_TOKENS: ${FHIR_WRITE_TOKENS:-}
    depends_on:
      redis:
        condition: service_healthy
  ws-gateway:
    environment:
      FHIR_WS_SIGNING_KEY: ${FHIR_WS_SIGNING_KEY:?đặt FHIR_WS_SIGNING_KEY (>= 32 ký tự, giống fhir-server)}
