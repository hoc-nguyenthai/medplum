        (cùng đường dẫn, khác method). Khớp 0 resource: PUT tạo mới, PATCH/DELETE
        trả 404; khớp nhiều resource trả 412.'
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Resource (PUT, mẫu là Patient) hoặc JSON Patch (PATCH)
        in: body
