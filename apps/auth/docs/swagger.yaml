      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      summary: Thu hẹp scope của login
      tags:
      - auth
  /auth/setpassword:
    post:
      consumes:
      - application/json
      description: Thu hồi mọi phiên đăng nhập của user. Link dùng được một lần.
      parameters:
      - description: id và secret của link, mật khẩu mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.SetPasswordBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
