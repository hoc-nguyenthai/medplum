# Data Prepper pipelines for trivita-observability: OTLP traces + logs + metrics -> OpenSearch.
#
# Verified end to end with Data Prepper 2.16.0 + OpenSearch 2.19.1 by
# tests/integration/test_opensearch.py of the Python trivita-observability repo, which
# runs this exact file. Keep both copies identical.
#
# - Data Prepper does NOT expand ${ENV_VAR} in this file. Ship it as a secret (k8s Secret
#   mounted at /usr/share/data-prepper/pipelines/) or, on AWS, use
#   password: "${{aws_secrets:<secret-id>:<key>}}" with an aws extension in data-prepper-config.yaml.
# - `username: data-prepper` is a dedicated OpenSearch user; grant it the index/template/ISM
#   permissions listed in the Data Prepper opensearch sink docs (the test uses admin).
# - `cert:` is the CA that signed OpenSearch's HTTP certificate; without it the sink fails
#   with "PKIX path building failed". `insecure: true` instead is for local dev only.
# - `flush_timeout` caps how long the sink waits to fill a bulk request (default 60000 ms,
#   measured as a ~60 s delay before spans/logs are searchable); 5000 keeps it ~5 s.
# - Sources accept gRPC only. Add `unframed_requests: true` to a source to also accept
#   OTLP/HTTP on /opentelemetry.proto.collector.{trace,logs}.v1.{Trace,Logs}Service/Export.
# - `otlp_traces` / `otlp_logs` / `otlp_metrics` are the 2.16 names; older Data Prepper
#   releases only know `otel_trace_source` / `otel_logs_source` / `otel_metrics_source`
#   (same options, deprecated in 2.16).

entry-pipeline:
  source:
    otlp_traces:            # gRPC on 21890
      ssl: false            # in-cluster traffic; set ssl + sslKeyCertChainFile/sslKeyFile otherwise
  sink:
    - pipeline: { name: raw-trace-pipeline }
    - pipeline: { name: service-map-pipeline }

raw-trace-pipeline:
  source:
    pipeline: { name: entry-pipeline }
  processor:
    - otel_traces:
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        cert: /usr/share/data-prepper/certs/root-ca.pem
        username: data-prepper
        password: "__OPENSEARCH_PASSWORD__"
        flush_timeout: 5000                          # ms; default 60000 delays every document ~1 min
        index_type: trace-analytics-raw              # -> otel-v1-apm-span-*

service-map-pipeline:
  source:
    pipeline: { name: entry-pipeline }
  processor:
    - service_map:
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        cert: /usr/share/data-prepper/certs/root-ca.pem
        username: data-prepper
        password: "__OPENSEARCH_PASSWORD__"
        flush_timeout: 5000                          # ms; default 60000 delays every document ~1 min
        index_type: trace-analytics-service-map      # -> otel-v1-apm-service-map

log-pipeline:
  source:
    otlp_logs:              # gRPC on 21892
      ssl: false
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        cert: /usr/share/data-prepper/certs/root-ca.pem
        username: data-prepper
        password: "__OPENSEARCH_PASSWORD__"
        flush_timeout: 5000                          # ms; default 60000 delays every document ~1 min
        index_type: log-analytics                    # -> logs-otel-v1-* (template + ISM policy)

metrics-pipeline:
  source:
    otlp_metrics:           # gRPC on 21891
      ssl: false
  processor:
    - otel_metrics:
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        cert: /usr/share/data-prepper/certs/root-ca.pem
        username: data-prepper
        password: "__OPENSEARCH_PASSWORD__"
        flush_timeout: 5000                          # ms; default 60000 delays every document ~1 min
        # -> metrics-otel-v1-*. NOT `metric-analytics`: its template maps `resource.*` to
        # keyword, so OpenSearch 2.19 rejects every metric document (400, KeywordFieldMapper
        # cannot be cast to ObjectMapper) while the exporter still reports success.
        index_type: metric-analytics-plain
