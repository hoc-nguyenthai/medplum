basePath: /
definitions:
  httpapi.DicomJSONElement:
    properties:
      BulkDataURI:
        description: URI lấy dữ liệu nhị phân lớn
        type: string
      InlineBinary:
        description: dữ liệu nhị phân nhỏ dạng base64
        example: AQID
        type: string
      Value:
        description: 'danh sách giá trị: chuỗi, số, tên người ({"Alphabetic": ...})
          hoặc dataset (phần tử của SQ)'
        items: {}
        type: array
      vr:
        description: Value Representation của phần tử
        enum:
        - AE
        - AS
        - AT
        - CS
        - DA
        - DS
        - DT
        - FL
        - FD
        - IS
        - LO
        - LT
        - OB
        - OD
        - OF
        - OL
        - OV
        - OW
        - PN
        - SH
        - SL
        - SQ
        - SS
        - ST
        - SV
        - TM
        - UC
        - UI
        - UL
        - UN
        - UR
        - US
        - UT
        - UV
        example: UI
        type: string
    required:
    - vr
    type: object
  httpapi.ErrorBody:
    properties:
      error:
        description: thông điệp lỗi; lỗi 5xx chỉ là mô tả trạng thái chuẩn
        example: Token không hợp lệ
        type: string
    required:
    - error
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        description: luôn "ok" khi tiến trình còn sống
        example: ok
        type: string
    required:
    - status
    type: object
  httpapi.ReadyResponse:
    properties:
      checks:
        additionalProperties:
          type: boolean
        description: kết quả từng phụ thuộc (database)
        type: object
      ready:
        description: true khi mọi phụ thuộc chính sẵn sàng và không đang tắt
        example: true
        type: boolean
    required:
    - checks
    - ready
    type: object
  httpapi.StowResponse:
    additionalProperties:
      $ref: '#/definitions/httpapi.DicomJSONElement'
    type: object
info:
  contact: {}
  description: 'DICOMweb (STOW-RS, QIDO-RS, WADO-RS) cho kho hình ảnh DICOM, dùng
    chung schema và kho Binary với fhir-server. Lỗi trả {"error": "..."}. STOW-RS,
    QIDO-RS (study, series, instance, có bộ lọc thuộc tính), WADO-RS (tải instance,
    series, study; metadata; frame) đã cài; bulkdata PixelData và WADO-URI đã cài
    (D9).'
  title: Trivita DICOMweb API
  version: "1.0"
paths:
  /dicomweb/instances:
    get:
      description: Trả metadata đã lưu của các instance khớp (kèm thuộc tính study,
        series và instance); lọc theo thuộc tính cấp study, series và instance (SOPInstanceUID,
        SOPClassUID, InstanceNumber). Cần quyền đọc.
      parameters:
      - description: Cỡ trang (mặc định 100, tối đa 1000)
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua
        in: query
        name: offset
        type: string
      - description: Thuộc tính cần lọc, theo từ khóa hoặc tag hex (ví dụ Modality=CT,
          PatientID=P1, 00080060=CT)
        in: query
        name: attributes
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm instance (cả project)'
      tags:
      - dicomweb
  /dicomweb/series:
    get:
      description: Như tìm series của một study nhưng không giới hạn study; lọc được
        theo thuộc tính cấp study và series (Modality, SeriesInstanceUID, SeriesNumber...).
        Cần quyền đọc.
      parameters:
      - description: Cỡ trang (mặc định 100, tối đa 1000)
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua
        in: query
        name: offset
        type: string
      - description: Thuộc tính cần lọc, theo từ khóa hoặc tag hex (ví dụ Modality=CT,
          PatientID=P1, 00080060=CT)
        in: query
        name: attributes
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm series (cả project)'
      tags:
      - dicomweb
  /dicomweb/studies:
    get:
      description: 'Trả các study của project (mới cập nhật trước) dạng DICOM JSON.
        Bộ lọc theo thuộc tính cấp study: PatientID, PatientName (khớp đầu chuỗi,
        dấu * ở cuối), StudyDate (ngày hoặc khoảng YYYYMMDD-YYYYMMDD), StudyInstanceUID,
        AccessionNumber, ModalitiesInStudy, StudyDescription..., theo từ khóa hoặc
        tag 8 chữ số hex; nhiều giá trị ngăn bằng dấu \ hoặc dấu phẩy là OR. Tham
        số không hỗ trợ bị bỏ qua và báo bằng `Warning: 299`, giá trị sai (ngày hỏng,
        ký tự đại diện ở giữa) là 400. Khi còn kết quả có header `Warning: 299`. Không
        có kết quả thì 200 với []. Cần quyền đọc.'
      parameters:
      - description: Cỡ trang (mặc định 100, tối đa 1000); giá trị hỏng dùng mặc định
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua; giá trị hỏng coi là 0
        in: query
        name: offset
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm study'
      tags:
      - dicomweb
    post:
      consumes:
      - multipart/related
      description: 'Thân là multipart/related; type="application/dicom" (mỗi phần
        là một tệp DICOM Part 10), truyền luồng: phần đầu (tối đa DICOMWEB_MAX_HEADER_BYTES)
        được kiểm tra, nội dung ghi vào kho Binary dùng chung với fhir-server, metadata
        thành DicomStudy, DicomSeries, DicomInstance (tìm được qua API FHIR). Tải
        lại cùng SOPInstanceUID là idempotent. Từng instance được xử lý độc lập: 200
        khi mọi instance thành công, 202 khi một phần (kèm FailedSOPSequence), 409
        khi không instance nào thành công. Instance hỏng, bị cắt giữa PixelData, SQ
        lồng quá sâu, vượt DICOMWEB_MAX_INSTANCE_BYTES bị từ chối riêng và không để
        lại gì. Cần quyền ghi.'
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mọi instance đã lưu
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "202":
          description: 'Một phần: có cả ReferencedSOPSequence và FailedSOPSequence'
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "400":
          description: Thân multipart sai, thiếu boundary hoặc không có phần nào
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "409":
          description: Không instance nào được lưu (FailedSOPSequence nêu lý do từng
            instance)
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "413":
          description: Body vượt DICOMWEB_MAX_REQUEST_BYTES
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "415":
          description: Content-Type không phải multipart/related
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'STOW-RS: lưu instance'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}:
    get:
      description: Trả mọi instance của study dạng multipart/related; type="application/dicom",
        mỗi phần là tệp DICOM Part 10 nguyên văn như lúc STOW, theo luồng (chunked,
        bộ nhớ hằng số). Không có thì 404 trước khi ghi byte nào; lỗi giữa chừng thì
        ngắt kết nối. Cần quyền đọc, gồm Binary.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      produces:
      - multipart/related
      - application/json
      responses:
        "200":
          description: 'multipart/related: mỗi phần là một tệp DICOM'
          schema:
            type: file
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: tải study'
      tags:
      - dicomweb
    post:
      consumes:
      - multipart/related
      description: Như STOW-RS ở /studies nhưng mọi instance phải thuộc study chỉ
        định; instance của study khác bị từ chối riêng với FailureReason 0xA900. Cần
        quyền ghi.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mọi instance đã lưu
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "202":
          description: 'Một phần: có cả ReferencedSOPSequence và FailedSOPSequence'
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "400":
          description: Thân multipart sai, thiếu boundary hoặc không có phần nào
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "409":
          description: Không instance nào được lưu
          schema:
            $ref: '#/definitions/httpapi.StowResponse'
        "413":
          description: Body vượt DICOMWEB_MAX_REQUEST_BYTES
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "415":
          description: Content-Type không phải multipart/related
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'STOW-RS: lưu instance vào một study'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/instances:
    get:
      description: Như tìm instance, giới hạn trong một study. Cần quyền đọc.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: Cỡ trang (mặc định 100, tối đa 1000)
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua
        in: query
        name: offset
        type: string
      - description: Thuộc tính cần lọc, theo từ khóa hoặc tag hex (ví dụ Modality=CT,
          PatientID=P1, 00080060=CT)
        in: query
        name: attributes
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm instance của study'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/metadata:
    get:
      description: Mảng metadata DICOM JSON của mọi instance trong study, theo luồng.
        Study không có thì 404 trước khi ghi byte nào; lỗi giữa chừng thì ngắt kết
        nối. Cần quyền đọc.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
