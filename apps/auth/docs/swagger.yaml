      - admin
  /admin/projects/setpassword:
    post:
      consumes:
      - application/json
      description: Chỉ user thuộc project của người gọi (user ở phạm vi server là
        400 `User not found`). Kiểm mật khẩu bị rò rỉ, thu hồi mọi login của user.
      parameters:
      - description: email và mật khẩu mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.AdminSetPasswordBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đặt mật khẩu cho user của project
      tags:
      - admin
  /admin/super/projects:
    post:
      consumes:
      - application/json
      description: Chỉ admin của project được đánh dấu superAdmin (`auth project super`).
        Tạo project cùng AccessPolicy mặc định, client mặc định và membership admin
        cho chủ sở hữu trong một transaction. `ownerEmail` phải là user toàn cục đã
        tồn tại (không gắn project); bỏ trống là chính người gọi. Trường ngoài danh
        sách là 400. `clientSecret` chỉ hiện một lần. Ghi log kiểm toán. Tắt mặc định
        (AUTH_SUPER_ADMIN_ENABLED).
      parameters:
      - description: Project
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.SuperProjectBody'
      produces:
      - application/json
      - application/fhir+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.SuperProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Tạo project mới (Project/$init)
      tags:
      - admin
  /auth/changepassword:
    post:
      consumes:
      - application/json
      description: Thu hồi MỌI phiên đăng nhập của user, kể cả phiên đang dùng.
      parameters:
      - description: Mật khẩu cũ và mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.ChangePasswordBody'
      produces:
      - application/fhir+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
