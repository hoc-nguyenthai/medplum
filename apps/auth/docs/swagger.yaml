        type: integer
      - description: id token đã cấp cho client này
        in: query
        name: id_token_hint
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Bắt đầu luồng authorization code (OAuth2/OIDC)
      tags:
      - oauth
  /oauth2/introspect:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - application/json
      description: 'Cần Bearer. Chỉ hỏi được token của cùng project và cùng client
        với người gọi; refresh token đã xoay là không hoạt động. Mọi lý do không dùng
        được đều ra `{"active": false}`.'
      parameters:
      - description: token cần kiểm tra
        in: formData
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.IntrospectResponse'
        "400":
          description: Token to introspect must be provided
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Kiểm tra một token (RFC 7662)
      tags:
      - oauth
  /oauth2/logout:
    get:
      description: Cần Bearer. Thu hồi login và xóa cookie đăng nhập của client. Sau
        đó chính access token này bị từ chối ở các route của auth (fhir-server chỉ
        biết khi token hết hạn).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đăng xuất (thu hồi login của access token)
      tags:
      - oauth
    post:
      description: Cần Bearer. Thu hồi login và xóa cookie đăng nhập của client. Sau
        đó chính access token này bị từ chối ở các route của auth (fhir-server chỉ
        biết khi token hết hạn).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đăng xuất (thu hồi login của access token)
      tags:
      - oauth
  /oauth2/register:
    post:
      consumes:
      - application/json
      description: 'Không phải đăng ký động theo RFC 7591: không tạo client mới và
        không trả client_secret. Chỉ có khi bật AUTH_OAUTH_REGISTER_ENABLED. redirect_uris[0]
        phải bằng chính xác redirect URI của một client dựng sẵn.'
      parameters:
      - description: redirect_uris
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.RegisterBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/application.RegisteredClient'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.TokenErrorBody'
      summary: Tra client dựng sẵn theo redirect URI
      tags:
      - oauth
  /oauth2/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        Chỉ nhận application/x-www-form-urlencoded. Grant hiện có: client_credentials, authorization_code và refresh_token (xoay secret; dùng lại thì thu hồi Login) (PKCE bắt buộc khi Login có challenge; client xác thực bằng HTTP Basic hoặc client_id + client_secret trong body).
        Scope do client khai không được chứa `fhir.*`; access token mang `fhir_project`, `scope` (kèm scope vai trò do auth thêm) và `fhir_access_policy` để fhir-server nhận.
      parameters:
      - description: client_credentials | authorization_code | refresh_token
        in: formData
        name: grant_type
        required: true
        type: string
      - description: authorization_code
        in: formData
        name: code
        type: string
      - description: authorization_code (PKCE)
        in: formData
        name: code_verifier
        type: string
      - description: 'authorization_code: bắt buộc nếu lúc đăng nhập đã gửi'
        in: formData
        name: redirect_uri
        type: string
      - description: refresh_token
        in: formData
        name: refresh_token
        type: string
      - description: nếu không dùng Basic
        in: formData
        name: client_id
        type: string
      - description: nếu không dùng Basic
        in: formData
        name: client_secret
        type: string
      - description: mặc định openid
        in: formData
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.TokenErrorBody'
      summary: Đổi thông tin lấy token (OAuth2)
      tags:
      - oauth
  /oauth2/userinfo:
    get:
      description: |-
        Cần Bearer access token. Trả `sub`; thêm theo scope của login (khớp từng từ): `profile` (profile, locale, updated_at, name, given_name, family_name), `email` (email, email_verified).
        Không có phone, address, birthdate, gender, picture: hồ sơ Patient/Practitioner nằm ở fhir-server, auth không đọc được (quyết định D-10).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: OIDC userinfo
      tags:
      - oauth
    post:
      description: |-
        Cần Bearer access token. Trả `sub`; thêm theo scope của login (khớp từng từ): `profile` (profile, locale, updated_at, name, given_name, family_name), `email` (email, email_verified).
        Không có phone, address, birthdate, gender, picture: hồ sơ Patient/Practitioner nằm ở fhir-server, auth không đọc được (quyết định D-10).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: OIDC userinfo
      tags:
      - oauth
  /scim/v2/Users:
    get:
      description: 'Chỉ admin của project (Bearer, hoặc Basic client:secret khi AUTH_SCIM_ALLOW_BASIC)
        và project có tính năng `scim`. filter chỉ hỗ trợ `userName eq "x"` (không
        phân biệt hoa thường), dạng khác là 400 invalidFilter. Phân trang thật: startIndex
        từ 1, count mặc định và trần là AUTH_SCIM_MAX_PAGE. Lỗi dạng SCIM Error.'
      parameters:
      - description: userName eq \
        in: query
        name: filter
        type: string
      - description: bắt đầu từ 1
        in: query
        name: startIndex
        type: integer
      - description: số kết quả
        in: query
        name: count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scim.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scim.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/scim.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/scim.Error'
      security:
      - BearerAuth: []
      summary: 'SCIM: liệt kê user của project'
      tags:
      - scim
    post:
      consumes:
      - application/json
      description: Chỉ userName, name, emails[0], externalId, userType (Patient|Practitioner|RelatedPerson,
        mặc định Practitioner) và active được dùng; mọi trường khác (admin, accessPolicy,
        groups, roles, extension) bị bỏ qua. Patient và Practitioner phải có chính
        sách truy cập mặc định của project. 409 nếu đã là member hoặc externalId trùng.
        Không gửi thư.
      parameters:
      - description: User
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scim.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/scim.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scim.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/scim.Error'
      security:
      - BearerAuth: []
      summary: 'SCIM: tạo user'
      tags:
      - scim
  /scim/v2/Users/{id}:
    delete:
      description: Xóa membership (User thuộc project mà hết membership thì bị xóa
        theo). Không xóa chủ project, admin cuối cùng hay membership của chính người
        gọi (400).
      parameters:
      - description: id membership
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scim.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scim.Error'
      security:
      - BearerAuth: []
      summary: 'SCIM: xóa user'
      tags:
      - scim
    get:
      description: id là id của ProjectMembership. Membership ngoài project, thuộc
        Bot/ClientApplication hoặc không tồn tại đều là 404.
      parameters:
      - description: id membership
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scim.User'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scim.Error'
      security:
      - BearerAuth: []
      summary: 'SCIM: đọc một user'
      tags:
      - scim
    patch:
      consumes:
      - application/json
      description: PatchOp với add, replace, remove. Chỉ active, externalId, name,
        name.givenName, name.familyName, emails ghi được; userName, userType và thuộc
        tính chuẩn không lưu (displayName...) bị bỏ qua; đường dẫn khác (admin, accessPolicy,
        profile...) là 400 invalidPath. add trên thuộc tính đa trị thay nguyên.
      parameters:
      - description: id membership
        in: path
        name: id
        required: true
        type: string
      - description: PatchOp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scim.PatchOp'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scim.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scim.Error'
      security:
      - BearerAuth: []
      summary: 'SCIM: sửa user (PATCH)'
      tags:
      - scim
    put:
      consumes:
      - application/json
      description: 'Dùng id của đường dẫn (id trong body có và khác là 400). Chỉ ghi
        name, externalId, emails[0], active. Đổi email của User thuộc project: emailVerified=false,
        vô hiệu mọi security request và thu hồi mọi login (một transaction); User
        ở phạm vi server không ghi được (đổi email là 403). userName không đổi được.'
      parameters:
      - description: id membership
        in: path
        name: id
        required: true
        type: string
      - description: User
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scim.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scim.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scim.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/scim.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scim.Error'
      security:
      - BearerAuth: []
      summary: 'SCIM: thay user (PUT)'
      tags:
      - scim
securityDefinitions:
  BearerAuth:
    description: Dạng "Bearer <access_token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
