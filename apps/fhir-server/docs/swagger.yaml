  /fhir/R4/{resourceType}/{id}:
    delete:
      description: 'Xóa mềm: resource vẫn nằm trong _history, đọc lại trả 410. Xóa
        vĩnh viễn dùng $expunge.'
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "204":
          description: No Content
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Xóa resource
      tags:
      - fhir
    get:
      description: 'Hỗ trợ If-None-Match (ETag) và If-Modified-Since: trả 304 nếu
        không đổi.'
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: Header ETag = W/\"versionId\
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "304":
          description: Không đổi so với If-None-Match / If-Modified-Since
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền read)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "410":
          description: Đã bị xóa
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Đọc resource
      tags:
      - fhir
    patch:
      consumes:
      - application/json-patch+json
      description: Body là mảng thao tác RFC 6902; Content-Type bắt buộc application/json-patch+json.
        Hỗ trợ If-Match.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      - description: Các thao tác JSON Patch
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/httpapi.JSONPatchOp'
          type: array
      - description: ETag phiên bản đang sửa
        in: header
        name: If-Match
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: Đã patch; header ETag mới
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "400":
          description: Patch sai cú pháp hoặc kết quả không hợp lệ
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "412":
          description: If-Match không khớp phiên bản hiện tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "415":
          description: Content-Type không phải application/json-patch+json
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Patch resource (JSON Patch)
      tags:
      - fhir
    put:
      consumes:
      - application/fhir+json
      description: Hỗ trợ If-Match (versionId) và update-as-create nếu bật. Body phải
        có id khớp với đường dẫn.
      parameters:
      - description: Loại resource
        in: path
        name: resourceType
        required: true
        type: string
      - description: Id
        in: path
        name: id
        required: true
        type: string
      - description: Resource (mẫu là Patient)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.PatientBody'
      - description: ETag phiên bản đang sửa, ví dụ W/\
        in: header
        name: If-Match
        type: string
      produces:
      - application/fhir+json
      responses:
        "200":
          description: Đã cập nhật; header ETag mới
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "201":
          description: Tạo mới (update-as-create)
          schema:
            $ref: '#/definitions/httpapi.FHIRResource'
        "400":
          description: Sai cấu trúc hoặc id không khớp
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "403":
          description: Token không đủ quyền (cần quyền write)
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "404":
          description: Không tồn tại và update-as-create đang tắt
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
        "412":
          description: If-Match không khớp phiên bản hiện tại
          schema:
            $ref: '#/definitions/fhir.OperationOutcome'
      security:
      - BearerAuth: []
      summary: Cập nhật resource
      tags:
      - fhir
