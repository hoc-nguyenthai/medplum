  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances:
    get:
      description: Như tìm instance, giới hạn trong một series. Cần quyền đọc.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: Cỡ trang (mặc định 100, tối đa 1000)
        in: query
        name: limit
        type: string
      - description: Số kết quả bỏ qua
        in: query
        name: offset
        type: string
      - description: Thuộc tính cần lọc, theo từ khóa hoặc tag hex (ví dụ Modality=CT,
          PatientID=P1, 00080060=CT)
        in: query
        name: attributes
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'QIDO-RS: tìm instance của series'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}:
    get:
      description: Như tải study, cho một instance (một phần duy nhất).
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      produces:
      - multipart/related
      - application/json
      responses:
        "200":
          description: 'multipart/related: một tệp DICOM'
          schema:
            type: file
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: tải instance'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/bulkdata/{tag}:
    get:
      description: 'Trả toàn bộ dữ liệu điểm ảnh (tag 7FE00010) của instance dạng
        multipart/related, có Content-Length, đọc theo khoảng nhờ chỉ mục frame. Dữ
        liệu không nén: MỘT phần application/octet-stream gồm mọi frame nối nhau.
        Dữ liệu đóng gói (nén): mỗi frame một phần, cùng Content-Type như route frame
        (khác chuẩn, vốn chia theo fragment). Metadata không chứa BulkDataURI (PixelData
        bị bỏ khỏi metadata) nên URL này chỉ biết theo quy ước. Tag khác 7FE00010
        là 404 vì các bulkdata khác bị bỏ lúc STOW. Cần quyền đọc, gồm Binary.'
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      - description: Tag 8 chữ số hex; chỉ 7FE00010 (PixelData)
        in: path
        name: tag
        required: true
        type: string
      produces:
      - multipart/related
      - application/json
      responses:
        "200":
          description: multipart/related
          schema:
            type: file
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có instance, ảnh hoặc bulkdata theo tag
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "416":
          description: Chỉ mục hoặc metadata không khớp số frame
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: bulkdata PixelData'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/frames/{frame}:
    get:
      description: 'Trả một hoặc nhiều frame dạng multipart/related (có Content-Length),
        chép theo luồng từ nội dung đã lưu (bộ nhớ hằng số). Content-Type của phần:
        application/octet-stream với dữ liệu không nén, image/jpeg, image/jls, image/jp2,
        image/jpx, image/jphc kèm transfer-syntax với dữ liệu nén. Frame đóng gói
        nhiều fragment được nối lại. Vị trí frame lấy từ chỉ mục lập lúc STOW và đọc
        theo khoảng nên chi phí tỉ lệ với kích thước frame (instance cũ chưa có chỉ
        mục hoặc kho không đọc theo khoảng thì quay về quét tệp). Cần quyền đọc, gồm
        cả quyền đọc Binary.'
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      - description: Số thứ tự frame bắt đầu từ 1, hoặc danh sách cách nhau bằng dấu
          phẩy (1,2,3; tối đa 50)
        in: path
        name: frame
        required: true
        type: string
      produces:
      - multipart/related
      - application/json
      responses:
        "200":
          description: 'multipart/related: mỗi phần là một frame'
          schema:
            type: file
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Study, series, instance không có, hoặc instance không có ảnh
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "416":
          description: Số frame vượt tổng số frame của instance
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: lấy frame'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/frames/{frame}/rendered:
    get:
      description: Như ảnh dựng của instance nhưng cho frame được chọn (một số, từ
        1). Frame vượt tổng số frame là 416.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      - description: Số thứ tự frame bắt đầu từ 1
        in: path
        name: frame
        required: true
        type: integer
      - description: 'center,width[,linear]: cửa sổ ghi đè (width > 0)'
        in: query
        name: window
        type: string
      - description: Chất lượng JPEG 1..100 (mặc định 90)
        in: query
        name: quality
        type: integer
      produces:
      - image/jpeg
      - image/png
      - application/json
      responses:
        "200":
          description: Ảnh JPEG hoặc PNG
          schema:
            type: file
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có instance hoặc ảnh
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "406":
          description: Accept không có định dạng hỗ trợ, hoặc dữ liệu điểm ảnh chưa
            dựng được
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "413":
          description: Frame quá lớn để dựng
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "416":
          description: Số frame vượt tổng số frame của instance
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: ảnh dựng của một frame'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/metadata:
    get:
      description: 'Mảng một phần tử: metadata DICOM JSON của instance. Cần quyền
        đọc.'
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: metadata của instance'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/instances/{instanceUid}/rendered:
    get:
      description: 'Trả frame đầu tiên của instance dưới dạng ảnh image/jpeg (mặc
        định) hoặc image/png theo header Accept. Dựng được: JPEG baseline (trả nguyên
        khi cần JPEG, giải mã và mã hóa PNG khi cần PNG), dữ liệu không nén xám 8
        hoặc 16 bit (window/level từ metadata, hoặc từ tham số `window`; MONOCHROME1
        được đảo) và RGB 8 bit. Mọi định dạng khác (JPEG 2000, JPEG-LS, RLE, YBR,
        bảng màu...) trả 406. Bộ nhớ một frame tối đa 64 MiB (vượt thì 413). Tham
        số viewport, annotation, iccprofile bị bỏ qua. Cần quyền đọc, gồm Binary.'
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      - description: UID của instance (SOPInstanceUID)
        in: path
        name: instanceUid
        required: true
        type: string
      - description: 'center,width[,linear]: cửa sổ ghi đè (width > 0)'
        in: query
        name: window
        type: string
      - description: Chất lượng JPEG 1..100 (mặc định 90)
        in: query
        name: quality
        type: integer
      produces:
      - image/jpeg
      - image/png
      - application/json
      responses:
        "200":
          description: Ảnh JPEG hoặc PNG
          schema:
            type: file
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có instance hoặc ảnh
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "406":
          description: Accept không có định dạng hỗ trợ, hoặc dữ liệu điểm ảnh chưa
            dựng được
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "413":
          description: Frame quá lớn để dựng
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: ảnh dựng của instance'
      tags:
      - dicomweb
  /dicomweb/studies/{studyUid}/series/{seriesUid}/metadata:
    get:
      description: Trả mảng metadata DICOM JSON của mọi instance trong series, theo
        luồng (không bị cắt ở 1000 instance như Medplum). Study hoặc series không
        có thì 404 trước khi ghi byte nào; lỗi giữa chừng thì ngắt kết nối. Cần quyền
        đọc.
      parameters:
      - description: UID của study (StudyInstanceUID)
        in: path
        name: studyUid
        required: true
        type: string
      - description: UID của series (SeriesInstanceUID)
        in: path
        name: seriesUid
        required: true
        type: string
      produces:
      - application/dicom+json
      - application/json
      responses:
        "200":
          description: Mảng DICOM JSON
          schema:
            items:
              additionalProperties:
                $ref: '#/definitions/httpapi.DicomJSONElement'
              type: object
            type: array
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Study hoặc series không có
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-RS: metadata của series'
      tags:
      - dicomweb
  /dicomweb/wado:
    get:
      description: 'WADO-URI (PS3.18 mục 8.1) cho client cũ. requestType=WADO, studyUID,
        seriesUID, objectUID bắt buộc. contentType (danh sách có q, hoặc header Accept
        khi bỏ trống): `application/dicom` trả tệp DICOM Part 10 nguyên văn (không
        multipart, chunked); `image/jpeg` (mặc định) hoặc `image/png` trả ảnh dựng
        của frame frameNumber (mặc định 1) với windowCenter, windowWidth, imageQuality,
        theo cùng giới hạn như `rendered` (định dạng điểm ảnh chưa dựng được: 406).
        Tham số khác của chuẩn (rows, columns, region, annotation, presentationUID,
        transferSyntax, charset) bị bỏ qua; anonymize khác "no" là 400. Cần quyền
        đọc, gồm Binary.'
      parameters:
      - description: Luôn là WADO
        in: query
        name: requestType
        required: true
        type: string
      - description: StudyInstanceUID
        in: query
        name: studyUID
        required: true
        type: string
      - description: SeriesInstanceUID
        in: query
        name: seriesUID
        required: true
        type: string
      - description: SOPInstanceUID
        in: query
        name: objectUID
        required: true
        type: string
      - description: application/dicom, image/jpeg (mặc định) hoặc image/png; có thể
          là danh sách kèm q
        in: query
        name: contentType
        type: string
      - description: Số thứ tự frame bắt đầu từ 1 (chỉ với ảnh)
        in: query
        name: frameNumber
        type: integer
      - description: Tâm cửa sổ (chỉ với ảnh; cần cả windowWidth)
        in: query
        name: windowCenter
        type: number
      - description: Độ rộng cửa sổ (> 0)
        in: query
        name: windowWidth
        type: number
      - description: Chất lượng JPEG 1..100
        in: query
        name: imageQuality
        type: integer
      - description: Chỉ chấp nhận no
        in: query
        name: anonymize
        type: string
      produces:
      - application/dicom
      - image/jpeg
      - image/png
      - application/json
      responses:
        "200":
          description: Tệp DICOM hoặc ảnh
          schema:
            type: file
        "400":
          description: Tham số thiếu hoặc không hợp lệ
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "401":
          description: Thiếu hoặc sai Bearer token
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "403":
          description: Token không đủ quyền hoặc chọn project khác
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "404":
          description: Không có study, series, instance hoặc ảnh
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "406":
          description: contentType không hỗ trợ hoặc điểm ảnh chưa dựng được
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "413":
          description: Frame quá lớn để dựng
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "416":
          description: Số frame vượt tổng số frame
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
        "500":
          description: Lỗi xử lý (không lộ chi tiết nội bộ)
          schema:
            $ref: '#/definitions/httpapi.ErrorBody'
      security:
      - BearerAuth: []
      summary: 'WADO-URI: lấy một instance bằng tham số truy vấn'
      tags:
      - dicomweb
  /health/live:
    get:
      description: Tiến trình còn sống; không kiểm phụ thuộc ngoài để orchestrator
        không restart pod vì lỗi của cơ sở dữ liệu.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: 'Sẵn sàng nhận yêu cầu: cơ sở dữ liệu trả lời trong READINESS_TIMEOUT.
        503 khi đang tắt (SIGTERM) hoặc phụ thuộc lỗi.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
        "503":
          description: Chưa sẵn sàng hoặc đang tắt
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
      summary: Readiness probe
      tags:
      - health
  /health/startup:
    get:
      description: Đã khởi động xong (route đã sẵn sàng); không kiểm phụ thuộc ngoài.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Startup probe
      tags:
      - health
  /healthz:
    get:
      description: Giống liveness; dùng cho HEALTHCHECK của image (`/app healthcheck`).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Healthcheck của Docker
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Dạng "Bearer <access_token>": JWT do auth cấp (kiểm bằng JWKS),
      có claim project. Đọc (QIDO, WADO) cần quyền đọc, ghi (STOW) cần quyền ghi.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 'DICOMweb. Bốn tiền tố tương đương: /dicomweb, /api/dicomweb, /projects/{projectId}/dicomweb,
    /api/projects/{projectId}/dicomweb; với hai tiền tố có project, projectId phải
    khớp project của token (token thường), không thì 403. Spec này liệt kê tiền tố
    /dicomweb.'
  name: dicomweb
- description: Probe liveness, startup và readiness cho orchestrator.
  name: health
