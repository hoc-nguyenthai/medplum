# Toàn bộ hệ thống trong MỘT file (không chồng file khác): gộp docker-compose.yml + auth + ws + dicomweb + split + split-auth.
#   postgres, redis              hạ tầng
#   auth             :8006       cấp token (JWT), schema identity
#   fhir-server      :8005       API FHIR, chỉ PHÁT sự kiện và tạo job (không giao, không tải, không chạy job), cấp token bind websocket
#   ws-gateway       :8007       giữ websocket của Subscription
#   dicomweb         :8008       STOW/QIDO/WADO, dùng chung schema fhir và kho Binary
#   fhir-downloader  :8009       tự tải attachment URL ngoài về kho Binary (chỉ probe)
#   fhir-notifier    :8010       giao rest-hook bền và khớp websocket (chỉ probe)
#   fhir-worker      :8011       job nền: bulk export, $reindex cả loại, batch async (chỉ probe)
#
# Chạy: make up-full (sinh hai khóa ký vào .env.full lần đầu, build, chạy nền và chờ mọi service healthy); dừng và xóa dữ liệu: make down-full.
# Chạy tay (hai khóa bắt buộc, >= 32 ký tự; mọi lệnh compose với file này, kể cả logs/exec/down, đều cần chúng):
#   docker compose -f docker-compose.full.yml --env-file .env.full up --build
# Đã chạy thử bằng Docker (OrbStack, 2026-11-25): 9 container healthy; token client_credentials của auth -> tạo và tìm Patient ở fhir-server; $export do
# fhir-worker chạy và Binary kết quả đọc được qua fhir-server; GET /dicomweb/studies 200; Subscription websocket -> binding token -> ws-gateway nhận
# event-notification (notifier khớp). Chưa thử: fhir-downloader tải URL ngoài, STOW DICOM, giao rest-hook.
#
# Điểm cần đúng (giải thích chi tiết ở các file chồng tương ứng):
#  - Xác thực bằng JWT của auth (không token tĩnh). issuer/audience là địa chỉ CÔNG KHAI của auth, JWKS tải qua mạng compose (http://auth:8000).
#  - Một kho Binary dùng chung (volume blobs ở /data) cho fhir-server, dicomweb, fhir-downloader, fhir-worker; production dùng s3:<bucket> cho cả bốn.
#  - Chỉ fhir-server migrate schema fhir (một replica); dicomweb, fhir-downloader, fhir-notifier, fhir-worker chờ fhir-server healthy.
#  - FHIR_BASE_URL giống hệt giữa fhir-server, fhir-downloader và fhir-worker. Tuỳ chọn router của fhir-worker phải trùng fhir-server (đặt cùng giá trị
#    trong apps/fhir-server/.env và apps/fhir-worker/.env).
#  - Websocket: fhir-server cấp token bind (FHIR_WS_MODE=issuer), fhir-notifier khớp sự kiện và phát lên Redis, ws-gateway giữ kết nối; FHIR_WS_SIGNING_KEY
#    giống nhau giữa fhir-server và ws-gateway.
#  - Không có chế độ role migrate riêng (docker-compose.db-roles.yml) và không mô phỏng chính sách mạng chặn đường ra Internet của fhir-server.
#  - Cấu hình riêng từng app vẫn đọc từ apps/<service>/.env (không bắt buộc); biến trong environment ở đây được ưu tiên hơn.
name: trivita-full

x-fhir-db: &fhir-db
  DATABASE_URL: postgres://fhir_app:${FHIR_DB_PASSWORD:-fhir}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
  DATABASE_REQUIRE_SCHEMA: "true"

x-jwt: &jwt
  FHIR_JWT_ISSUER: http://localhost:${AUTH_PORT_PUBLISHED:-8006}
  FHIR_JWT_AUDIENCE: http://localhost:${AUTH_PORT_PUBLISHED:-8006}
  FHIR_JWKS_URL: http://auth:8000/.well-known/jwks.json

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trivita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivita}
      POSTGRES_DB: ${POSTGRES_DB:-trivita}
      # mật khẩu role của từng service, dùng ở deploy/postgres-init/01-schemas.sh (mặc định chỉ để dev)
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      FHIR_DB_PASSWORD: ${FHIR_DB_PASSWORD:-fhir}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    image: trivita-auth:local
    restart: unless-stopped
    ports:
      - "${AUTH_PORT_PUBLISHED:-8006}:8000"
    env_file:
      - path: apps/auth/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:-identity}@postgres:5432/${POSTGRES_DB:-trivita}?sslmode=disable
      DATABASE_REQUIRE_SCHEMA: "true"
      DATABASE_AUTO_MIGRATE: "true"
      AUTH_BASE_URL: http://localhost:${AUTH_PORT_PUBLISHED:-8006}
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy

  fhir-server:
    build:
      context: .
      dockerfile: apps/fhir-server/Dockerfile
    image: trivita-fhir-server:local
    restart: unless-stopped
    ports:
      - "${FHIR_SERVER_PORT:-8005}:8000"
    env_file:
      - path: apps/fhir-server/.env
        required: false
    environment:
      <<: [*fhir-db, *jwt]
      HTTP_ADDR: ":8000"
      DATABASE_AUTO_MIGRATE: "true" # 1 replica: app tự migrate
      FHIR_BASE_URL: http://localhost:${FHIR_SERVER_PORT:-8005}/fhir/R4
      FHIR_JOB_SIGNING_KEY: ${FHIR_JOB_SIGNING_KEY:?đặt FHIR_JOB_SIGNING_KEY (>= 32 ký tự)}
      # JWT không dùng cùng token tĩnh: xóa mọi token tĩnh có thể đến từ apps/fhir-server/.env
      FHIR_WRITE_TOKENS: ""
      FHIR_READ_TOKENS: ""
      FHIR_ADMIN_TOKENS: ""
      FHIR_AUTH_DISABLED: "false"
      # chỉ PHÁT sự kiện, không giao, không tải, không chạy job
      BROKER_DRIVER: redis
      REDIS_URL: redis://redis:6379/0
      FHIR_SUBSCRIPTIONS: "true"
      FHIR_SUBSCRIPTION_DELIVERY: "false"
      FHIR_AUTO_DOWNLOAD: "true"
      FHIR_AUTO_DOWNLOAD_WORKER: "false"
      FHIR_JOB_EXECUTION: "false"
      FHIR_BINARY_STORAGE: file:/data/blobs
      # websocket: chỉ cấp token bind, kết nối do ws-gateway giữ
      FHIR_WS_MODE: issuer
      FHIR_WS_SIGNING_KEY: ${FHIR_WS_SIGNING_KEY:?đặt FHIR_WS_SIGNING_KEY (>= 32 ký tự, giống ws-gateway)}
      FHIR_WS_URL: ws://localhost:${WS_GATEWAY_PORT:-8007}/ws/subscriptions-r4
      LOG_JSON: "true"
    volumes:
      - blobs:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy

  ws-gateway:
    build:
      context: .
      dockerfile: apps/ws-gateway/Dockerfile
    image: trivita-ws-gateway:local
    restart: unless-stopped
    ports:
      - "${WS_GATEWAY_PORT:-8007}:8000"
    env_file:
      - path: apps/ws-gateway/.env
        required: false
    environment:
      HTTP_ADDR: ":8000"
      REDIS_URL: redis://redis:6379/0
      FHIR_WS_SIGNING_KEY: ${FHIR_WS_SIGNING_KEY:?đặt FHIR_WS_SIGNING_KEY (>= 32 ký tự, giống fhir-server)}
      LOG_JSON: "true"
    depends_on:
      redis:
        condition: service_healthy

  dicomweb:
    build:
      context: .
      dockerfile: apps/dicomweb/Dockerfile
    image: trivita-dicomweb:local
    restart: unless-stopped
    ports:
      - "${DICOMWEB_PORT:-8008}:8000"
    env_file:
      - path: apps/dicomweb/.env
        required: false
    environment:
      <<: [*fhir-db, *jwt]
      HTTP_ADDR: ":8000"
      DICOMWEB_BASE_URL: http://localhost:${DICOMWEB_PORT:-8008}
      FHIR_BINARY_STORAGE: file:/data/blobs
      LOG_JSON: "true"
    volumes:
      - blobs:/data
    depends_on:
      fhir-server:
        condition: service_healthy
      auth:
        condition: service_healthy

  fhir-downloader:
    build:
      context: .
      dockerfile: apps/fhir-downloader/Dockerfile
    image: trivita-fhir-downloader:local
    restart: unless-stopped
    ports:
      - "${FHIR_DOWNLOADER_PORT:-8009}:8000"
    env_file:
      - path: apps/fhir-downloader/.env
        required: false
    environment:
      <<: *fhir-db
      HTTP_ADDR: ":8000"
      REDIS_URL: redis://redis:6379/0
      FHIR_BASE_URL: http://localhost:${FHIR_SERVER_PORT:-8005}/fhir/R4
      FHIR_BINARY_STORAGE: file:/data/blobs
      LOG_JSON: "true"
    volumes:
      - blobs:/data
    depends_on:
      fhir-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  fhir-notifier:
    build:
      context: .
      dockerfile: apps/fhir-notifier/Dockerfile
    image: trivita-fhir-notifier:local
    restart: unless-stopped
    ports:
      - "${FHIR_NOTIFIER_PORT:-8010}:8000"
    env_file:
      - path: apps/fhir-notifier/.env
        required: false
    environment:
      <<: *fhir-db
      HTTP_ADDR: ":8000"
      REDIS_URL: redis://redis:6379/0
      # fhir-server tắt giao (FHIR_SUBSCRIPTION_DELIVERY=false) nên notifier khớp cả sự kiện websocket và phát cho ws-gateway
      FHIR_WS_MODE: issuer
      LOG_JSON: "true"
    depends_on:
      fhir-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  fhir-worker:
    build:
      context: .
      dockerfile: apps/fhir-worker/Dockerfile
    image: trivita-fhir-worker:local
    restart: unless-stopped
    ports:
      - "${FHIR_WORKER_PORT:-8011}:8000"
    env_file:
      - path: apps/fhir-worker/.env
        required: false
    environment:
      <<: *fhir-db
      HTTP_ADDR: ":8000"
      FHIR_BASE_URL: http://localhost:${FHIR_SERVER_PORT:-8005}/fhir/R4
      FHIR_BINARY_STORAGE: file:/data/blobs
      # job mang chữ ký quyền của người gọi (JWT): cùng khóa với fhir-server; FHIR_JWT_ISSUER chỉ để biết JWT đang bật
      FHIR_JWT_ISSUER: http://localhost:${AUTH_PORT_PUBLISHED:-8006}
      FHIR_JOB_SIGNING_KEY: ${FHIR_JOB_SIGNING_KEY:?đặt FHIR_JOB_SIGNING_KEY (>= 32 ký tự, giống fhir-server)}
      # fhir-server phát sự kiện (Subscription và tự tải bật) nên batch async do fhir-worker ghi cũng phải phát
      FHIR_SUBSCRIPTIONS: "true"
      FHIR_AUTO_DOWNLOAD: "true"
      BROKER_DRIVER: redis
      REDIS_URL: redis://redis:6379/0
      FHIR_JOB_MAINTENANCE_INTERVAL: 2s
      LOG_JSON: "true"
    volumes:
      - blobs:/data
    depends_on:
      fhir-server:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  blobs: # kho nội dung Binary dùng chung fhir-server, dicomweb, fhir-downloader và fhir-worker
